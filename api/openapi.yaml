        cover:
          type: boolean
        revision_marks:
          type: boolean
        widths:
          type: object
          additionalProperties:
            type: number
    PrintLayout:
      type: object
      required: [id, name, document_type_id, document_type_key, is_default, layout, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        document_type_id:
          type: string
        document_type_key:
          type: string
        is_default:
          type: boolean
        layout:
          $ref: '#/components/schemas/PrintLayoutContent'
        updated_at:
          type: string
          format: date-time
    PrintLayoutList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrintLayout'
    PrintLayoutInput:
      type: object
      required: [name, layout]
      properties:
        name:
          type: string
        document_type_id:
          type: string
          description: Only for a new layout.
        layout:
          type: object
          description: The layout content; missing values take the defaults (A3 landscape, 8 pt, 10 mm).
    CustomerPrintLayout:
      type: object
      required: [document_type_id, layout_id]
      properties:
        document_type_id:
          type: string
        layout_id:
          type: string
    CustomerPrintLayoutList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerPrintLayout'
    CustomerPrintLayoutInput:
      type: object
      properties:
        layout_id:
          type: string
          description: Leave out to go back to the default layout.
    DocumentRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRevision'
    AffectedDocument:
      type: object
      required: [id, number, document_type, revision, status]
      properties:
        id:
          type: string
        number:
          type: string
        document_type:
          $ref: '#/components/schemas/ChangeRef'
        revision:
          type: integer
        status:
          type: string
        released_revision:
          type: integer
          description: The revision in force. Missing until the first release.
        draft_revision:
          type: integer
          description: The draft revision this change produced, once the change is accepted (M5.4).
        merged:
          type: boolean
          description: True when the change went into a draft that was already open (R-CHG-03).
        rows_updated:
          type: integer
          description: For a template change, the rows that took the new template content (M5.8).
        rows_conflict:
          type: integer
          description: For a template change, the rows changed locally that were kept (conflict policy keep).
        rows_removed:
          type: integer
          description: For a template change, the rows whose point no longer exists in the new version.
    NewChange:
      type: object
      required: [customer_id, trigger_id, change_type_id, reason, document_ids]
      properties:
        customer_id:
          type: string
        trigger_id:
          type: string
        change_type_id:
          type: string
        four_m_category_id:
          type: string
        reason:
          type: string
        source_reference:
          type: string
        document_ids:
          type: array
          items:
            type: string
    ChangeDocumentInput:
      type: object
      required: [document_id]
      properties:
        document_id:
          type: string
    DocumentSection:
      type: object
      required: [id, key, position, name, part_numbers]
      properties:
        id:
          type: string
          description: The section of this document. Rows name this ID.
        key:
          type: string
          description: The same for this section in every document of the set; composition and the check use it.
        position:
          type: integer
        name:
          type: string
          example: Heatsink Assy (R/L)
        part_numbers:
          type: array
          items:
            $ref: '#/components/schemas/DocumentPartNumber'
    NewDocumentSection:
      type: object
      required: [name]
      properties:
        name:
          type: string
        part_number_ids:
          type: array
          items:
            type: string
    DocumentSectionUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        position:
          type: integer
        part_number_ids:
          type: array
          items:
            type: string
    ReferencedDocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReferencedDocument'
    ReferencedDocument:
      type: object
      required: [id, number, title, active, links, created_at]
      properties:
        id:
          type: string
        number:
          type: string
