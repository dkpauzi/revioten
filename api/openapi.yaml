# Kontrak API untuk layar web (R-API-02, D-38). Ditulis lebih dulu, lalu kode
# server Go (oapi-codegen) dan tipe TypeScript (@hey-api/openapi-ts) dibuat
# dari file ini. Jangan mengubah kode hasil generate; ubah file ini lalu jalankan
# ulang generator (lihat CLAUDE.md, bagian perintah).
#
# Teks description berbahasa Inggris karena dibaca pemakai API, sama seperti
# teks layar (Q-14). Komentar dengan tanda # tetap berbahasa Indonesia.
openapi: 3.0.4
info:
  title: Revioten web API
  version: 0.1.0
  description: |
    API used by the web screens of the PFD, PFMEA, and CP system.

    Conventions (R-API-13):
    - JSON over HTTP. Times are UTC in ISO 8601.
    - IDs are opaque and stable. Clients must not parse them.
    - Every response carries an `X-Request-Id` header. A client may send its
      own `X-Request-Id` (1 to 64 characters: letters, digits, `.`, `_`, `-`);
      otherwise the server creates one.
    - Every error uses the `Error` schema, with the same request ID as the
      header. Technical details are written only to the server log.
    - Every operation needs a session (cookie `__Host-revioten_session`,
      set by `POST /api/v1/session`), except where `security` is empty.
      Without a valid session the answer is 401 `unauthenticated`.
    - Requests that change data from another site are refused with 403
      `forbidden` (checked with the Sec-Fetch-Site and Origin headers).
    - Every operation checks the rights of the caller (M1.2). Without the
      right, the answer is 403 `forbidden`. The rights of the caller are
      listed in `Session.permissions`, with codes from the user map (U3).
# Semua operasi butuh sesi login (M1.1, UC-01), kecuali yang menulis security: [].
security:
  - sessionCookie: []
paths:
  # E-17 (diputuskan): /health ada di root, di luar /api/v1.
  /health:
    get:
      operationId: getHealth
      summary: Server and database status
      # E-08 (D-85): /health terbuka tanpa login, karena dipakai untuk memantau
      # server dan tidak berisi data.
      security: []
      responses:
        '200':
          description: The server and the database are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The server runs, but the database is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/session:
    get:
      operationId: getSession
      summary: The session of the caller
      responses:
        '200':
          description: The caller is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: login
      summary: Log in with a login name and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Logged in. The response sets the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: logout
      summary: Log out and end the session
      responses:
        '204':
          description: Logged out. The response removes the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/account/email:
    get:
      operationId: getOwnEmail
      summary: The email address of the caller (D-104, D-194)
      responses:
        '200':
          description: The email address; empty when none is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAddress'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setOwnEmail
      summary: Set the email address of the caller for notifications (D-104, D-194)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailAddress'
      responses:
        '200':
          description: The saved address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAddress'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts/{accountId}/email:
    put:
      operationId: setAccountEmail
      summary: Set the email address of the person of an account (A-1, D-194)
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailAddress'
      responses:
        '200':
          description: The saved address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAddress'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/notifications:
    get:
      operationId: getNotifications
      summary: Email settings, events, and the latest 100 emails of the outbox (A-3, D-194)
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationOverview'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/notifications/events/{event}:
    put:
      operationId: setNotificationEvent
      summary: Switch one notification event on or off (A-3)
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '204':
          description: Saved.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/notifications/test:
    post:
      operationId: sendTestEmail
      summary: Put a test email for the caller in the outbox (A-3)
      responses:
        '204':
          description: The test email waits in the outbox.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/account/password:
    put:
      operationId: changePassword
      summary: Change the password of the caller
      description: |
        Needs the current password. All sessions of the account end, and the
        response sets a new session cookie for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: The password was changed. The response sets a new session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: The role catalog with the rights of each role (A-1)
      responses:
        '200':
          description: All roles, active and inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createRole
      summary: Add a work role (A-1, D-199)
      description: >-
        The new role holds the basic rights L-1 to L-3, plus the rights of `copy_from` when given (never admin
        rights). Its ID comes from the English name and never changes. Audit-logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRole'
      responses:
        '201':
          description: The new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/roles/{roleId}:
    patch:
      operationId: updateRole
      summary: Rename a work role, or change whether it can be limited to the own project group (A-1, D-199)
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChange'
      responses:
        '200':
          description: The changed role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/roles/{roleId}/active:
    put:
      operationId: setRoleActive
      summary: Deactivate or activate a work role (A-1, D-199)
      description: >-
        A role can be deactivated only when no account holds it. Roles are never deleted, so the audit log stays
        readable. The admin and viewer roles cannot be changed.
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleActive'
      responses:
        '200':
          description: The role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/permissions:
    get:
      operationId: listPermissions
      summary: The permission catalog in the order of the user map (A-1, M8.1)
      responses:
        '200':
          description: All permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/roles/{roleId}/permissions:
    put:
      operationId: setRolePermissions
      summary: Replace the permissions of one work role (A-1, M8.1, D-66)
      description: >-
        The admin and viewer roles cannot be changed, a work role never holds admin rights (A-1 to A-4), and the
        basic rights L-1 to L-3 always stay (R-SEC-11). Every change is audit-logged.
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissions'
      responses:
        '200':
          description: The role with its new permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/service-accounts:
    get:
      operationId: listServiceAccounts
      summary: Service accounts of the integration API with their tokens (A-1, M9.1)
      responses:
        '200':
          description: All service accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createServiceAccount
      summary: Make a service account for another application (A-1, M9.1, R-API-04)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewServiceAccount'
      responses:
        '201':
          description: The service account was made. Issue a token next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/service-accounts/{serviceAccountId}/tokens:
    post:
      operationId: issueServiceToken
      summary: Issue a token (A-1). The token value is shown in this answer only.
      parameters:
        - $ref: '#/components/parameters/ServiceAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewServiceToken'
      responses:
        '201':
          description: The token. Only its hash is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedServiceToken'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/service-accounts/{serviceAccountId}/tokens/{tokenId}:
    delete:
      operationId: revokeServiceToken
      summary: Revoke a token (A-1). It is refused at once.
      parameters:
        - $ref: '#/components/parameters/ServiceAccountId'
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The token was revoked.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/service-accounts/{serviceAccountId}/disable:
    post:
      operationId: disableServiceAccount
      summary: Disable a service account (A-1). All its tokens are refused; it is never deleted.
      parameters:
        - $ref: '#/components/parameters/ServiceAccountId'
      responses:
        '204':
          description: The service account was disabled.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: All accounts with their person and roles (A-1)
      responses:
        '200':
          description: All accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAccount
      summary: Create an account with a temporary password (A-1)
      description: |
        The temporary password is returned only in this response. The owner
        must change it at the first login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccount'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts/{accountId}/roles:
    put:
      operationId: setAccountRoles
      summary: Replace the roles of a work account (A-1)
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolesUpdate'
      responses:
        '200':
          description: The roles were replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts/{accountId}/password-reset:
    post:
      operationId: resetAccountPassword
      summary: Set a new temporary password for another account (A-1)
      description: |
        All sessions of the account end, the account is unlocked, and the
        owner must change the password at the next login.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The new temporary password, shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPassword'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts/{accountId}/disable:
    post:
      operationId: disableAccount
      summary: Disable another account and end its sessions (A-1)
      description: The last active admin account cannot be disabled (D-73).
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts/{accountId}/enable:
    post:
      operationId: enableAccount
      summary: Enable an account again and unlock it (A-1)
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: List all customers, ordered by code
      responses:
        '200':
          description: All customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCustomer
      summary: Add a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCustomer'
      responses:
        '201':
          description: The customer was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/customers/{customerId}:
    put:
      operationId: updateCustomer
      summary: Change the name, project group, and status of a customer (E-11)
      description: |
        Customers are never deleted; set `active` to false instead (E-09).
        The code is changed with POST /api/v1/customers/{customerId}/code.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: The customer was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/customers/{customerId}/code:
    post:
      operationId: changeCustomerCode
      summary: Give a customer a new code; the old code stays in its history (E-11, E-11)
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCodeChange'
      responses:
        '200':
          description: The code was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/project-groups:
    get:
      operationId: listProjectGroups
      summary: All project groups, ordered by code
      responses:
        '200':
          description: All project groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroupList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProjectGroup
      summary: Add a project group (E-11)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupInput'
      responses:
        '201':
          description: The project group was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroup'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/project-groups/{projectGroupId}:
    put:
      operationId: updateProjectGroup
      summary: Change the code and name of a project group (E-11)
      parameters:
        - $ref: '#/components/parameters/ProjectGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupInput'
      responses:
        '200':
          description: The project group was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroup'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/model-groups:
    get:
      operationId: listModelGroups
      summary: The model groups of one customer, ordered by name
      parameters:
        - $ref: '#/components/parameters/CustomerIdQuery'
      responses:
        '200':
          description: The model groups of the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroupList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createModelGroup
      summary: Add a model group to a customer (E-11)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewModelGroup'
      responses:
        '201':
          description: The model group was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroup'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/model-groups/{modelGroupId}:
    put:
      operationId: updateModelGroup
      summary: Rename a model group (E-11)
      parameters:
        - $ref: '#/components/parameters/ModelGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelGroupUpdate'
      responses:
        '200':
          description: The model group was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroup'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/models:
    get:
      operationId: listModels
      summary: The models of one customer, ordered by name
      parameters:
        - $ref: '#/components/parameters/CustomerIdQuery'
      responses:
        '200':
          description: The models of the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createModel
      summary: Add a model to a customer, in at most one model group (E-11, D-42)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewModel'
      responses:
        '201':
          description: The model was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/models/{modelId}:
    put:
      operationId: updateModel
      summary: Rename a model or move it to another model group of the same customer (E-11)
      parameters:
        - $ref: '#/components/parameters/ModelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdate'
      responses:
        '200':
          description: The model was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/part-numbers:
    get:
      operationId: listPartNumbers
      summary: The part numbers of one customer, ordered by model and number
      parameters:
        - $ref: '#/components/parameters/CustomerIdQuery'
      responses:
        '200':
          description: The part numbers of the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartNumberList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createPartNumber
      summary: Add a part number to a model (E-11)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPartNumber'
      responses:
        '201':
          description: The part number was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartNumber'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/part-numbers/{partNumberId}:
    put:
      operationId: updatePartNumber
      summary: Change the number and name of a part number (E-11)
      parameters:
        - $ref: '#/components/parameters/PartNumberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartNumberUpdate'
      responses:
        '200':
          description: The part number was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartNumber'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/processes:
    get:
      operationId: listProcesses
      summary: All processes with their aliases, ordered by name (UC-04)
      responses:
        '200':
          description: The process master.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProcess
      summary: Add a process with a fixed ID, a display name, and aliases (E-6, D-06, D-64)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProcess'
      responses:
        '201':
          description: The process was added.
          content:
