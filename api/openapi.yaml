      schema:
        type: string
    SubprocessId:
      name: subprocessId
      in: path
      required: true
      schema:
        type: string
    PointId:
      name: pointId
      in: path
      required: true
      schema:
        type: string
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-revioten_session
  responses:
    Error:
      description: |
        The request failed. `code` says why: `invalid_request` (400, the body
        cannot be read as JSON), `validation_failed` (422, see `details`),
        `conflict` (409, for example the code is already used), `not_found`
        (404), `method_not_allowed` (405), `unauthenticated` (401, no valid
        session), `invalid_credentials` (401, login failed),
        `password_change_required` (403, change the password first),
        `forbidden` (403, the caller lacks the right or the request came
        from another site), or `internal_error` (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unreachable]
    Customer:
      type: object
      required: [id, code, name, active, codes, created_at]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        code:
          type: string
          description: Current customer code used in document numbers, for example SC-AB-001.
          pattern: '^[A-Z]{2}$'
          example: AB
        name:
          type: string
          example: Example Customer
        default_route:
          $ref: '#/components/schemas/ApprovalRouteRef'
        project_group:
          $ref: '#/components/schemas/ProjectGroupRef'
        signature_mode:
          type: string
          enum: [digital, wet_only]
          description: digital allows digital signatures; wet_only requires wet signatures (D-198).
        submission_required:
          type: boolean
          description: Revisions of this customer's documents need customer submission by default (D-207).
        active:
          type: boolean
          description: Customers are never deleted; inactive customers get no new models (E-09).
        codes:
          type: array
          description: All codes of the customer, oldest first. The last one is the current code (E-11).
          items:
            $ref: '#/components/schemas/CustomerCode'
        created_at:
          type: string
          format: date-time
    CustomerCode:
      type: object
      required: [code, valid_from]
      properties:
        code:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          description: Missing for the current code.
    ProjectGroupRef:
      type: object
      required: [id, code]
      description: |
        The project group of the customer (D-54). Missing only for customers
        added before project groups existed.
      properties:
        id:
          type: string
        code:
          type: string
    Credentials:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: admin.example
        password:
          type: string
          format: password
    Session:
      type: object
      required: [account, person, must_change_password, permissions]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        person:
          $ref: '#/components/schemas/Person'
        must_change_password:
          type: boolean
          description: |
            True after an admin reset the password. Until the password is
            changed, other operations answer 403 `password_change_required`.
        permissions:
          type: array
          description: |
            The rights of the caller, as codes from the user map (U3), for
            example L-1 or E-11. Screens use them to show or hide actions; the
            server still checks every operation.
          items:
            type: string
    Account:
      type: object
      required: [id, login, kind]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        login:
          type: string
        kind:
          type: string
          description: A work account, or the separate admin account (D-72).
          enum: [work, admin]
    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        name:
          type: string
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          description: |
            15 to 128 characters. Common passwords and passwords that contain
            the login name, the person name, or the system name are refused.
    RoleGrant:
      type: object
      required: [role, scope]
      properties:
        role:
          type: string
          description: Role ID, for example ppap_engineer or project_leader.
        scope:
          type: string
          description: |
            `all` for all customers, or `own_project_group` for the customers
            of the project group where the person is Project Leader or
            Project Engineer (D-71). Only roles with `group_scope` can use
            `own_project_group`.
          enum: [all, own_project_group]
    Role:
      type: object
      required: [id, level, name_en, name_id, active, builtin, group_scope, holders, permissions]
      properties:
        id:
          type: string
        level:
          type: string
          enum: [view, edit, verify, admin]
        name_en:
          type: string
        name_id:
          type: string
        active:
          type: boolean
          description: An inactive role cannot be given to an account (D-199).
        builtin:
          type: boolean
          description: Seeded by the system, not added by an admin.
        group_scope:
          type: boolean
          description: The role can be limited to the own project group (D-71).
        holders:
          type: integer
          description: Number of accounts that hold the role.
        permissions:
          type: array
          items:
            type: string
    NewRole:
      type: object
      required: [name_en, name_id]
      properties:
        name_en:
          type: string
          maxLength: 60
        name_id:
          type: string
          maxLength: 60
        group_scope:
          type: boolean
        copy_from:
          type: string
          description: ID of a role whose rights are copied.
    RoleChange:
      type: object
      required: [name_en, name_id, group_scope]
      properties:
        name_en:
          type: string
          maxLength: 60
        name_id:
          type: string
          maxLength: 60
        group_scope:
          type: boolean
    RoleActive:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    PermissionInfo:
      type: object
      required: [code, level]
      properties:
        code:
          type: string
        level:
          type: string
          enum: [view, edit, verify, admin]
    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PermissionInfo'
    RolePermissions:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: string
    ServiceAccount:
      type: object
      required: [id, name, owner_team, contact, purpose, scopes, customer_ids, customer_codes, networks, disabled, created_at, tokens]
      properties:
        id:
          type: string
        name:
          type: string
        owner_team:
          type: string
        contact:
          type: string
        purpose:
          type: string
        scopes:
          type: array
          items:
            type: string
        customer_ids:
          type: array
          items:
            type: string
        customer_codes:
          type: array
          items:
            type: string
        networks:
          type: array
          items:
            type: string
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/ServiceToken'
    ServiceToken:
      type: object
      required: [id, prefix, expires_at, created_at]
      properties:
        id:
          type: string
        prefix:
          type: string
          description: The first part of the token, to recognise it. Not a secret.
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    ServiceAccountList:
      type: object
      required: [items, scopes]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount'
        scopes:
          type: array
          description: Every scope that can be given.
          items:
            type: string
    NewServiceAccount:
      type: object
      required: [name, owner_team, contact, purpose, scopes, customer_ids]
      properties:
        name:
          type: string
        owner_team:
          type: string
        contact:
          type: string
        purpose:
          type: string
        scopes:
          type: array
          items:
            type: string
        customer_ids:
          type: array
          items:
            type: string
        networks:
          type: array
          description: Allowed source networks as CIDR. Leave it out for any address.
          items:
            type: string
    NewServiceToken:
      type: object
      properties:
        days:
          type: integer
          description: Lifetime in days, 1 to 365. The default is 90.
    IssuedServiceToken:
      type: object
      required: [token, info]
      properties:
        token:
          type: string
          description: The token value. Shown once; copy it now.
        info:
          $ref: '#/components/schemas/ServiceToken'
    EmailAddress:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Empty removes the address.
    NotificationOverview:
      type: object
      required: [provider, from, server, events, outbox]
      properties:
        provider:
          type: string
          description: graph, smtp, log, or empty when email is not set up. Set by IT in the server settings.
        from:
          type: string
        server:
          type: string
        events:
          type: array
          items:
            type: object
            required: [key, enabled]
            properties:
              key:
                type: string
              enabled:
                type: boolean
        outbox:
          type: array
          items:
            $ref: '#/components/schemas/OutboxEntry'
    OutboxEntry:
      type: object
      required: [id, event, recipient, subject, status, attempts, created_at]
      properties:
        id:
          type: string
        event:
          type: string
        recipient:
          type: string
        email:
          type: string
        subject:
          type: string
        status:
          type: string
          enum: [pending, sending, sent, failed, skipped]
        reason:
          type: string
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    AccountInfo:
      type: object
      required: [id, kind, login, person, roles, must_change_password, disabled, created_at]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        kind:
          type: string
          enum: [work, admin]
        login:
          type: string
        person:
          $ref: '#/components/schemas/PersonInfo'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        must_change_password:
          type: boolean
        locked_until:
          type: string
          format: date-time
          description: Set while the account is locked after failed logins.
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    PfdStepKey:
      type: object
      required: [section_key, operation, process_id]
      properties:
        section_key:
          type: string
          description: The section (D-155); empty for a set without sections.
        operation:
          type: string
        process_id:
          type: string
          description: Empty for a PFD step without a process.
    ComposeFromPfdInput:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PfdStepKey'
    PfdComposition:
      type: object
      required: [pfd_id, documents, steps, extra, repeated]
      properties:
        repeated:
          type: array
          description: Processes used at more than one step number of one PFD (D-213); each step should use its own registered process.
          items:
            $ref: '#/components/schemas/PfdRepeatedProcess'
        pfd_id:
          type: string
          description: The PFD of the set; empty when the set has none.
        documents:
          type: array
          description: The PFMEA and the CP of the set.
          items:
            $ref: '#/components/schemas/PfdTargetDocument'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PfdStep'
        extra:
          type: array
          items:
            $ref: '#/components/schemas/PfdStepOutside'
    PfdRepeatedProcess:
      type: object
      required: [section_key, process_name, operations]
      properties:
        section_key:
          type: string
        process_name:
          type: string
        operations:
          type: array
          items:
            type: string
    PfdTargetDocument:
      type: object
      required: [id, document_type_key, document_type_name]
      properties:
        id:
          type: string
        document_type_key:
          type: string
        document_type_name:
          type: string
    PfdStep:
      type: object
      required: [section_key, operation, process_id, process_name, symbol, ng, template_version_id, template_version, targets]
      properties:
        section_key:
          type: string
        operation:
          type: string
        process_id:
          type: string
        process_name:
          type: string
        symbol:
          type: string
        ng:
          type: string
        template_version_id:
          type: string
          description: The latest published process template version of the process; empty without one.
        template_version:
          type: integer
        targets:
          type: array
          items:
            $ref: '#/components/schemas/PfdStepTarget'
    PfdStepTarget:
      type: object
      required: [document_id, document_type_key, points, state]
      properties:
        document_id:
          type: string
        document_type_key:
          type: string
        points:
          type: integer
        state:
          type: string
          enum: [present, to_add, no_template, not_draft]
    PfdStepOutside:
      type: object
      required: [document_id, document_type_key, section_key, operation, process_name]
      properties:
        document_id:
          type: string
        document_type_key:
          type: string
        section_key:
          type: string
        operation:
          type: string
        process_name:
          type: string
    PagePreview:
      type: object
      description: Page plan shared by the preview, the PDF, and the Excel file (C3). Sizes are in millimetres.
      required: [title, number, revision, paper_w_mm, paper_h_mm, margins_mm, font_size, head_mm, group_row_mm, label_row_mm, mark_mm, columns_mm, flow_column, flow_left_mm, header, columns, pages]
      properties:
        title:
          type: string
        number:
          type: string
        revision:
          type: string
        paper_w_mm:
          type: number
        paper_h_mm:
          type: number
        margins_mm:
          type: object
          required: [top, right, bottom, left]
          properties:
            top:
              type: number
            right:
              type: number
            bottom:
              type: number
            left:
              type: number
        font_size:
          type: number
        head_mm:
          type: number
        group_row_mm:
          type: number
        label_row_mm:
          type: number
        mark_mm:
          type: number
          description: Width of the revision mark column; 0 when it does not print.
        columns_mm:
          type: array
          items:
            type: number
        flow_column:
          type: integer
          description: Index of the column where the process flow is drawn; -1 when the form has none.
        flow_left_mm:
          type: number
        header:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
              value:
                type: string
        columns:
          type: array
          items:
            type: object
            required: [label, group]
            properties:
              label:
                type: string
              group:
                type: string
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PreviewPage'
        legend_svg:
          type: string
          description: Legend of the PFD diagram, shown above the diagram of every page; missing for a table.
        legend_mm:
          type: number
          description: Height of the legend; 0 for a table.
        head_html:
          type: string
          description: Form head in the layout of the TR-020 documents (E-144), the same HTML as the PDF, with its style. Missing for other document types; the preview then draws the plain head from header.
    PreviewPage:
      type: object
      required: [rows, flow_svg]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [height_mm, section, mark, cells]
            properties:
              height_mm:
                type: number
              section:
                type: string
                description: Title of a section row (one PCB, D-155); empty for a content row.
              mark:
                type: string
              cells:
                type: array
                items:
                  type: object
                  required: [text, rowspan, skip, merged, flow, height_mm]
                  properties:
                    text:
                      type: string
                    rowspan:
                      type: integer
                    skip:
                      type: boolean
                      description: Covered by a merged cell above it.
                    merged:
                      type: boolean
                    flow:
                      type: boolean
                    height_mm:
                      type: number
        flow_svg:
          type: string
          description: SVG of the process flow of this page (symbols, NG branches, connectors), in millimetres; empty without a flow column.
        diagram_svg:
          type: string
          description: A PFD prints as a diagram (E-144). SVG of the diagram of this page, in millimetres; missing for a table. The page then has no rows.
    PersonInfoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonInfo'
    PersonInfo:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        name:
          type: string
        employee_number:
          type: string
        email:
          type: string
          description: Address for email notifications (D-194).
    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountInfo'
    NewAccount:
      type: object
      required: [kind, login]
      description: |
        Give `person_id` for a person who already has an account (for example
        an admin account for the PPAP Staff, D-72), or `person_name` for a
        new person, not both.
      properties:
        person_id:
          type: string
        person_name:
          type: string
        employee_number:
          type: string
        kind:
          type: string
          enum: [work, admin]
        login:
          type: string
        roles:
          type: array
          description: Roles of a work account. An admin account always holds only the admin role.
          items:
            $ref: '#/components/schemas/RoleGrant'
    CreatedAccount:
      type: object
      required: [account, temporary_password]
      properties:
        account:
          $ref: '#/components/schemas/AccountInfo'
        temporary_password:
          type: string
          description: Shown only once. Give it to the owner of the account.
    TemporaryPassword:
      type: object
      required: [temporary_password]
      properties:
        temporary_password:
          type: string
          description: Shown only once. Give it to the owner of the account.
    RolesUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
    AuditEntry:
      type: object
      required: [seq, occurred_at, actor, action, details, prev_hash, hash]
      properties:
        seq:
          type: integer
          format: int64
          description: Number in the chain, starting at 1, without gaps.
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          type: string
          description: Event code, for example account.created or customer.created.
        target:
          $ref: '#/components/schemas/AuditTarget'
        details:
          type: object
          additionalProperties:
            type: string
          description: Never contains passwords, tokens, or keys.
        request_id:
          type: string
        source_ip:
          type: string
        prev_hash:
          type: string
          description: Hash of the entry before this one (64 zeros for the first entry).
        hash:
          type: string
          description: SHA-256 of this entry and prev_hash, 64 lowercase hexadecimal characters.
    AuditActor:
      type: object
      required: [type]
      description: |
        `human` is a logged-in account, shown with the person who holds it
        (D-74). `system` is a command on the server computer, for example
        create-admin. `anonymous` is someone who is not logged in, for
        example a failed login.
      properties:
        type:
          type: string
          enum: [human, system, anonymous]
        account_id:
          type: string
        login:
          type: string
        person_id:
          type: string
        person_name:
          type: string
    AuditTarget:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          description: What the entry is about, for example account or customer.
        id:
          type: string
        label:
          type: string
          description: Display name, for example the login of an account or the code of a customer.
    AuditEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_before:
          type: integer
          format: int64
          description: Give this as `before` to read older entries. Missing when there are no older entries.
    AuditVerification:
      type: object
      required: [valid, entries]
      properties:
        valid:
          type: boolean
        entries:
          type: integer
          format: int64
          description: Number of entries checked.
        last_seq:
          type: integer
          format: int64
        last_hash:
          type: string
          description: |
            Hash of the last entry. Noted outside the system, it also reveals
            a removed last entry later.
        broken_seq:
          type: integer
          format: int64
          description: The first entry that does not fit the chain.
        reason:
          type: string
          enum: [sequence_gap, link_mismatch, hash_mismatch]
          description: |
            `sequence_gap`: a number is missing, so an entry was removed.
            `link_mismatch`: prev_hash differs from the hash of the entry before.
            `hash_mismatch`: the content no longer matches the hash, so it was changed.
    NewCustomer:
      type: object
      required: [code, name, project_group_id]
      properties:
        code:
          type: string
          description: |
            Two letters A to Z. Spaces around the code are removed and letters
            are made uppercase. ZZ is reserved for general documents.
          example: ab
        name:
          type: string
          description: 1 to 200 characters after spaces around it are removed.
          example: Example Customer
        project_group_id:
          type: string
          description: Each customer is allocated to one project group (D-54).
    CustomerUpdate:
      type: object
      required: [name, project_group_id]
      properties:
        name:
          type: string
        project_group_id:
          type: string
        active:
          type: boolean
          # E-34 (D-111): opsional, supaya klien yang lupa mengirimnya tidak
          # menonaktifkan customer tanpa sengaja.
          description: Leave it out to keep the current status.
    CustomerCodeChange:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: |
            Two letters A to Z. A code that another customer uses, or used
            before, is refused.
    ProjectGroup:
      type: object
      required: [id, code, name, created_at]
      properties:
        id:
          type: string
        code:
          type: string
          example: GR1
        name:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectGroupInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: 1 to 10 letters A to Z or digits, made uppercase, for example GR1.
        name:
          type: string
    ProjectGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectGroup'
    ModelGroup:
      type: object
      required: [id, customer_id, name, created_at]
      description: A named set of models of one customer that share template content (D-39, D-42).
      properties:
        id:
          type: string
        customer_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    NewModelGroup:
      type: object
      required: [customer_id, name]
      properties:
        customer_id:
          type: string
        name:
          type: string
          description: 1 to 200 characters, unique within the customer.
    ModelGroupUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ModelGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelGroup'
    Model:
      type: object
      required: [id, customer_id, name, created_at]
      properties:
        id:
          type: string
        customer_id:
          type: string
        model_group:
          $ref: '#/components/schemas/ModelGroupRef'
        name:
          type: string
        created_at:
          type: string
          format: date-time
        eol_at:
          type: string
          format: date-time
          description: Set when the model is end of life (D-200).
    ModelGroupRef:
      type: object
      required: [id, name]
      description: The model group of the model. Missing when the model is in no group.
      properties:
        id:
          type: string
        name:
          type: string
    NewModel:
      type: object
      required: [customer_id, name]
      properties:
        customer_id:
          type: string
        name:
          type: string
          description: 1 to 200 characters, unique within the customer.
        model_group_id:
          type: string
          description: A model group of the same customer. Leave it out for no group.
    ModelUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        model_group_id:
          type: string
          description: Leave it out to take the model out of its group.
    ModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    PartNumber:
      type: object
      required: [id, customer_id, model, number, created_at]
      properties:
        id:
          type: string
        customer_id:
          type: string
        model:
          $ref: '#/components/schemas/ModelRef'
        number:
          type: string
        name:
          type: string
          description: Name of the part, for example the description on the PFMEA.
        created_at:
          type: string
          format: date-time
    ModelRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    NewPartNumber:
      type: object
      required: [model_id, number]
      properties:
        model_id:
          type: string
        number:
          type: string
          description: 1 to 100 characters, unique within the customer of the model.
        name:
          type: string
    PartNumberUpdate:
      type: object
      required: [number]
      properties:
        number:
          type: string
        name:
          type: string
          description: Leave it out to remove the name.
    PartNumberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartNumber'
    Process:
      type: object
      required: [id, name, aliases, created_at]
      description: |
        A manufacturing step, for example IQC (D-06, R-DOC-04). The ID never
        changes; the name is only a display value. Other data refers to the
        process by its ID.
      properties:
        id:
          type: string
        name:
          type: string
        aliases:
          type: array
          description: Other names of the same process, for example the name used in an older document, ordered alphabetically.
          items:
            type: string
        created_at:
          type: string
          format: date-time
    NewProcess:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            1 to 200 characters. Repeated spaces become one. Names and aliases
            of all processes share one namespace, ignoring case: a name used
            by any process, as a name or an alias, is taken.
        aliases:
          type: array
          maxItems: 20
          description: Leave it out for no aliases. Each alias follows the rules of the name.
          items:
            type: string
    ProcessUpdate:
      type: object
      required: [name, aliases]
      properties:
        name:
          type: string
        aliases:
          type: array
          maxItems: 20
          description: Replaces all aliases of the process. Send an empty list to remove them.
          items:
            type: string
    ProcessList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Process'
    NumberSettings:
      type: object
      required: [factory_code, pattern, sequence_format, revision_digits]
      properties:
        factory_code:
          type: string
          description: One letter A to Z, the first letter of every number prefix (E-12).
          example: S
        pattern:
          type: string
          description: |
            Number pattern for new numbers (R-NUM-02, M2.1) with the tokens
            {prefix} (factory code and document type letter), {customer}, and
            {seq} (running number), separated by punctuation.
          example: '{prefix}-{customer}-{seq}'
        sequence_format:
          type: string
          enum: [letter_block]
          description: Running number format - 001 to 999, then A001 to A999, B001, up to Z999 (D-89).
        revision_digits:
          type: integer
          description: Digits of the revision label, for example 2 for -04 (R-REV-01).
          example: 2
    NumberSettingsUpdate:
      type: object
      required: [factory_code]
      properties:
        factory_code:
          type: string
        pattern:
          type: string
          description: Leave it out to keep the current pattern.
        revision_digits:
          type: integer
          description: 1 to 3. Leave it out to keep the current value.
    NewDocumentNumber:
      type: object
      required: [customer_id, document_type_id]
      properties:
        customer_id:
          type: string
        document_type_id:
          type: string
          description: PFD, PFMEA, or CP. Other document types are not numbered by the system.
        initial_revision:
          type: integer
          description: First revision of the document that uses the number, for example 4 for a legacy document entering at -04 (M2.4). Default 0.
    NewDocumentNumberSet:
      type: object
      required: [customer_id]
      properties:
        customer_id:
          type: string
        initial_revision:
          type: integer
          description: First revision of the three documents, for example 4 for -04. Default 0.
    NextDocumentNumber:
      type: object
      required: [number]
      properties:
        number:
          type: string
          example: SC-AB-001
    NumberRegistration:
      type: object
      required: [items, replayed]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentNumber'
        replayed:
          type: boolean
          description: True when the Idempotency-Key was used before for the same request.
    DocumentNumber:
      type: object
      required: [id, number, customer, customer_code, document_type, sequence, status, initial_revision, revision_label, origin, batch_id, registered_by, created_at]
      description: One number in the register (R-NUM-04). Numbers are never deleted or reused; only the status changes.
      properties:
        id:
          type: string
        number:
          type: string
          description: The number as registered. It is never recomputed (R-NUM-02).
          example: SC-AB-001
        customer:
          $ref: '#/components/schemas/CustomerRef'
        customer_code:
          type: string
          description: The customer code inside the number. An older code when the customer code was changed later (E-11).
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        sequence:
          type: integer
          description: Value of the running number, for example 1 for 001 and 1000 for A001.
        status:
          type: string
          enum: [reserved, in_use, released, obsolete, void, skipped]
        initial_revision:
          type: integer
        revision_label:
          type: string
          description: The initial revision as printed, for example -04.
        origin:
          type: string
          enum: [single, set, import]
          description: How the number entered the register. Numbers of one set share batch_id.
        batch_id:
          type: string
        registered_by:
          $ref: '#/components/schemas/Person'
        status_reason:
          type: string
          description: Reason given when the number was voided or made obsolete.
        status_changed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    DocumentNumberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentNumber'
        next_before:
          type: string
          description: Give this as `before` to read the next page. Missing on the last page.
    StatusReason:
      type: object
      properties:
        reason:
          type: string
          description: Required to void a number; optional to make it obsolete. One line, at most 500 characters.
    NumberImportRequest:
      type: object
      required: [customer_id, status, text]
      properties:
        customer_id:
          type: string
        status:
          type: string
          enum: [reserved, in_use, released, obsolete, void]
          description: The status of every number in this import.
        text:
          type: string
          description: Legacy numbers, one set per line, at most 5000 lines that are not blank.
        one_set:
          type: boolean
          description: True when the numbers missing from a line follow its first number (D-216). Default false.
        dry_run:
          type: boolean
          description: True to get the report without saving anything. Default false.
    NumberImportReport:
      type: object
      required: [dry_run, status, imported, lines, groups, misaligned]
      properties:
        dry_run:
          type: boolean
        status:
          type: string
          enum: [reserved, in_use, released, obsolete, void]
        imported:
          type: integer
          description: Numbers imported, or the numbers a dry run would import.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/NumberImportLine'
        groups:
          type: array
          description: The register of each customer code (old codes first) and document type after the import.
          items:
            $ref: '#/components/schemas/NumberImportGroup'
        misaligned:
          type: array
          description: Running numbers that only some of PFD, PFMEA, and CP have. Skipped numbers do not count.
          items:
            $ref: '#/components/schemas/NumberMisalignment'
    NumberImportLine:
      type: object
      required: [line, text, result]
      properties:
        line:
          type: integer
          description: The line in the pasted text, from 1. Blank lines are left out.
        text:
          type: string
          description: One column of the line, without surrounding spaces, or the number that follows (derived).
        result:
          type: string
          enum: [imported, existing, duplicate, customer_mismatch, invalid, type_repeated]
        first_line:
          type: integer
          description: For a duplicate, the line where the number first appears.
        derived:
          type: boolean
          description: True when the number follows the first number of its line (one_set).
    NumberImportGroup:
      type: object
      required: [customer_code, document_type, count, gaps]
      properties:
        customer_code:
          type: string
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        count:
          type: integer
          description: Numbers in the register, all statuses.
        highest:
          type: string
          description: The highest running number, for example 007. Missing when count is 0.
        gaps:
          type: array
          description: Running numbers missing from 001 to the highest. They are reported, never filled.
          items:
            $ref: '#/components/schemas/SequenceRange'
    NumberMisalignment:
      type: object
      required: [customer_code, range, present]
      properties:
        customer_code:
          type: string
        range:
          $ref: '#/components/schemas/SequenceRange'
        present:
          type: array
          description: The document types that have a number in this range.
          items:
            $ref: '#/components/schemas/DocumentTypeRef'
    SequenceRange:
      type: object
      required: [first, last]
      properties:
        first:
          type: string
          example: '003'
        last:
          type: string
          example: '006'
    CustomerRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
        code:
          type: string
          description: The current customer code.
        name:
          type: string
    DocumentTypeRef:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [pfd, pfmea, cp]
        name:
          type: string
    DocumentType:
      type: object
      required: [id, name, letter, prefix]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [pfd, pfmea, cp]
          description: Set for the documents this system builds. Missing for other document types from the WI.
        name:
          type: string
        letter:
          type: string
          description: One letter A to Z, unique among document types.
        prefix:
          type: string
          description: The factory code followed by the letter, for example SH.
    DocumentTypeInput:
      type: object
      required: [name, letter]
      properties:
        name:
          type: string
          description: 1 to 200 characters, unique among document types, ignoring case.
        letter:
          type: string
    DocumentTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'
    SpecialCode:
      type: object
      required: [id, code, name, created_at]
      properties:
        id:
          type: string
        code:
          type: string
          description: Two or three letters A to Z, used in place of a customer code, for example ZZ.
        name:
          type: string
        created_at:
          type: string
          format: date-time
    NewSpecialCode:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    SpecialCodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpecialCode'
    NameUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 200 characters, unique within its list, ignoring case.
    ChangeType:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [content, layout, administrative]
        name:
          type: string
        approval_route:
          $ref: '#/components/schemas/ApprovalRouteRef'
    ChangeTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeType'
    ChangeSource:
      type: object
      required: [id, name, active, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        mechanism:
          type: string
          enum: [yokoten, template, sqam]
          description: Set when the system itself creates changes with this source. Such a source stays active.
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    ChangeSourceUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        active:
          type: boolean
          description: Leave it out to keep the current status.
    ChangeSourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeSource'
    FourMCategory:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [man, machine, material, method]
        name:
          type: string
    FourMCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FourMCategory'
    Position:
      type: object
      required: [id, key, name, per_project_group, single_holder, holders]
      description: A job title in the approval workflow (D-54). The key never changes; the name may (D-58).
      properties:
        id:
          type: string
