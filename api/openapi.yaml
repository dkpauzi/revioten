  /api/v1/format-templates:
    get:
      operationId: listFormatTemplates
      summary: Format templates with a summary of their versions (L-2, UC-20, R-TPL-01)
      responses:
        '200':
          description: The format templates, by document type and name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatTemplateList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createFormatTemplate
      summary: Add a format template with a draft version 1, empty or copied from another version (A-2, UC-20)
      description: |
        A copy gets new field IDs that belong to the new template, with the
        same labels, order, options, risk method, highlight rule, rating
        criteria, and symbols. Without a copy, risk_method is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFormatTemplate'
      responses:
        '201':
          description: The format template was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatTemplate'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-templates/{formatTemplateId}:
    put:
      operationId: renameFormatTemplate
      summary: Rename a format template (A-2)
      parameters:
        - $ref: '#/components/parameters/FormatTemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatTemplateRename'
      responses:
        '200':
          description: The format template was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatTemplate'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-templates/{formatTemplateId}/versions:
    post:
      operationId: createFormatVersion
      summary: Make the next draft version of a format template from its last published version (A-2, R-TPL-05)
      description: >-
        The new version copies the fields, rating criteria, symbols, and highlight rule of the last version, with the
        same field IDs. Refused with 409 while the template still has a draft version.
      parameters:
        - $ref: '#/components/parameters/FormatTemplateId'
      responses:
        '201':
          description: The new draft version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/ap-rules:
    put:
      operationId: setFormatApRules
      summary: Replace the Action Priority table of a draft version (A-2, D-134)
      description: >-
        Only for a version with the AP risk method. The table must give exactly one priority for each of the 1,000
        combinations of severity, occurrence, and detection.
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApRuleList'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/action-priority:
    get:
      operationId: getActionPriority
      summary: The Action Priority of one severity, occurrence, and detection, from the AP table of the version (L-2, D-134)
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
        - name: severity
          in: query
          required: true
          schema:
            type: integer
        - name: occurrence
          in: query
          required: true
          schema:
            type: integer
        - name: detection
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The action priority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPriorityResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/publish:
    post:
      operationId: publishFormatVersion
      summary: Publish a draft version of a format template (A-2, R-TPL-05)
      description: A published version cannot be changed. Changes go into a new version. Refused with 409 if it is already published.
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      responses:
        '200':
          description: The published version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}:
    get:
      operationId: getFormatVersion
      summary: One format template version with its fields, rating criteria, and symbols (L-2)
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateFormatHighlights
      summary: Change the highlight rule of a draft version, for example RPN above 100 or severity 8 (A-2, R-TPL-11)
      description: Highlights mark rows; they never block saving. 0 switches a rule off, and a field that is not sent stays as it is.
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatHighlights'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/fields:
    post:
      operationId: addFormatField
      summary: Add a header field or a column at the end of its area in a draft version (A-2, R-TPL-02)
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFormatField'
      responses:
        '201':
          description: The version with the new field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/fields/{formatFieldId}:
    put:
      operationId: updateFormatField
      summary: Change the label, required flag, hidden flag, position, or options of a field in a draft version (A-2, R-TPL-02)
      description: |
        The field ID, area, and kind never change, so row content that uses
        the ID stays valid. Fields are hidden, never deleted. A field that is
        not sent stays as it is. Options cannot be removed; options without a
        key are new and get a key from their label.
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
        - $ref: '#/components/parameters/FormatFieldId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatFieldUpdate'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/rating-criteria:
    put:
      operationId: setFormatRatingCriteria
      summary: Change the criteria text of rating values in a draft version (A-2, R-TPL-01)
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingCriteriaUpdate'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/symbols:
    put:
      operationId: saveFormatSymbols
      summary: Rename symbols and add new ones in a draft version (A-2, R-TPL-11)
      description: Symbols cannot be removed, because rows may use their keys. Symbols without a key are new.
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatSymbolList'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents:
    get:
      operationId: listDocuments
      summary: Documents of one customer (L-4, M4.1)
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The documents, by number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createDocument
      summary: Make a draft document from a Reserved document number (E-2, M4.1)
      description: >-
        The document uses the latest published version of the form set of its customer (D-133) and the default approval
        route of the customer, unless another route is given with a reason (D-47). The number becomes In use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDocument'
      responses:
        '201':
          description: The document was made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}:
    get:
      operationId: getDocument
      summary: One document with its header and rows (L-4)
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/header:
    put:
      operationId: setDocumentHeader
      summary: Replace the header content of a draft document (E-2)
      description: Content is keyed by header field ID of the format version of the document (R-DOC-01).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentHeader'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/composition:
    get:
      operationId: getDocumentComposition
      summary: The points of one process template version and their state in this document set (L-4, M4.5)
      description: >-
        Shows the points that apply to the first model of the document, the most specific variant winning. A point is
        included (a row is linked to it), excluded, or undecided (R-CMP-03). Points for a document type that the set
        does not have are left out.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: process_template_version_id
          in: query
          required: true
          schema:
            type: string
        - name: section_key
          in: query
          description: The section (D-155); required when the set has sections.
          schema:
            type: string
      responses:
        '200':
          description: The composition view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: composeDocument
      summary: Use or leave out points of a published process template version (E-2, M4.5)
      description: >-
        A point in include gets a row linked to it in the document of its type, unless it already has one (R-CMP-04).
        A point in exclude loses its row and is recorded as excluded, with an optional reason (R-CMP-03). Points not
        named stay as they are. One call fills PFD, PFMEA, and CP of the same set (R-CMP-02).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeInput'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/pfmea-cp:
    get:
      operationId: getPfmeaCpComparison
      summary: The PFMEA and the CP of the document set side by side, per process (L-4, M4.9)
      description: >-
        Opens from any document of the set. Rows are grouped by process, in the order the processes first appear
        (PFMEA first, then CP); rows without a process come last. Each process may carry a "checked by, date" mark
        for the current revisions of both documents (R-DOC-06).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PfmeaCpComparison'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: markPfmeaCpChecked
      summary: Set or clear the "checked by, date" mark of one process (V-2, D-65)
      description: >-
        A mark that is still current keeps its person and time. Marking a process that changed after its check renews
        the mark. Setting and clearing are written to the audit log.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PfmeaCpCheckInput'
      responses:
        '200':
          description: The comparison after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PfmeaCpComparison'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/differences:
    get:
      operationId: getDocumentDifferences
      summary: Compare each linked row with its process template point (L-4, M4.8)
      description: >-
        A row composed from a process template stays linked to its point. The answer lists every linked row: the same
        as the template, different (with the columns that differ), or detached with its reason (R-CMP-04). Typed and
        pasted rows are left out. Differences are computed when asked; nothing is stored.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowDifferenceList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/rows/{rowId}/detach:
    post:
      operationId: detachDocumentRow
      summary: Detach one row from its process template point, with a reason (E-2, M4.8)
      description: The row stays and keeps its origin point, but is no longer compared with the template (R-CMP-04).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowDetach'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/copy:
    post:
      operationId: copyDocumentComposition
      summary: Start a document set from the rows of another model's documents (E-2, M4.7)
      description: >-
        Copies the rows and the excluded points of the source document into this one, and the same for the other
        documents of the set (PFD from PFD, PFMEA from PFMEA, CP from CP). The target set must have no rows yet, and
        the source must be another document of the same customer, document type, and form version. The copy gets new
        row IDs and is independent of its source (R-CMP-05).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCopy'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/order:
    put:
      operationId: reorderDocumentRows
      summary: Save a new order of the rows, and number the operations when asked (E-2, M4.6)
      description: >-
        row_ids holds every row of the document exactly once, in the new order. With renumber, consecutive rows of the
        same process are one step and get one operation number, in steps of 10. A number that was typed or pasted
        (operation_manual) is kept (R-CMP-01).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentOrder'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/referenced-documents:
    get:
      operationId: listReferencedDocuments
      summary: The master list of referenced documents with their process links (L-2, D-130, D-156)
      responses:
        '200':
          description: All referenced documents by number, inactive ones included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedDocumentList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createReferencedDocument
      summary: Add a referenced document such as a WI, SOP, or QEP (E-6)
      description: The number is stored in capitals and stays fixed. A number already in the list gives 409 with code taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReferencedDocument'
      responses:
        '201':
          description: The new document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedDocument'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/referenced-documents/{refDocId}:
    put:
      operationId: updateReferencedDocument
      summary: Change the title, level, revision, revision date, or active state of a referenced document (E-6)
      description: Fields left out stay as they are, except the title, which is required (D-111). Documents are never deleted; an inactive one is no longer used as a default.
      parameters:
        - $ref: '#/components/parameters/RefDocId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferencedDocumentUpdate'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedDocument'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/referenced-documents/{refDocId}/links:
    post:
      operationId: addReferencedDocumentLink
      summary: Make a document a default of one process, for a scope (E-6)
      description: >-
        The scope works like the scope of a template point (D-129): general when left out, or a customer, model group,
        or model. For one model all links that apply are added together.
      parameters:
        - $ref: '#/components/parameters/RefDocId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReferencedDocumentLink'
      responses:
        '201':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedDocument'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/referenced-documents/{refDocId}/links/{linkId}:
    delete:
      operationId: removeReferencedDocumentLink
      summary: Remove one process link of a referenced document (E-6)
      parameters:
        - $ref: '#/components/parameters/RefDocId'
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedDocument'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes:
    get:
      operationId: listChanges
      summary: The changes of one customer, newest first (L-4, M5.1)
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChange
      summary: Submit a change request (E-3, M5.1, R-CHG-01, UC-40)
      description: >-
        A manual change has a trigger (a change source that is not a system mechanism, D-113), a type of change, an
        optional 4M category, a reason, an optional source reference, and one or more affected documents of the same
        customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewChange'
      responses:
        '201':
          description: The new change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}:
    get:
      operationId: getChange
      summary: One change with its affected documents (L-4)
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      responses:
        '200':
          description: The change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/documents:
    post:
      operationId: addChangeDocument
      summary: Add one affected document to a submitted change (E-3)
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDocumentInput'
      responses:
        '201':
          description: The change after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/documents/{documentId}:
    delete:
      operationId: removeChangeDocument
      summary: Remove one affected document from a submitted change (E-3)
      description: The last affected document cannot be removed.
      parameters:
        - $ref: '#/components/parameters/ChangeId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The change after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/verification:
    post:
      operationId: verifyChange
      summary: Accept or reject a submitted change with a note (V-1, M5.3)
      description: >-
        Only the Project Engineer or the Project Leader of the customer's project group, or the APQP/PPAP
        Controller, verifies (D-51, D-54). The requester cannot verify their own change (R-CHG-02).
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeVerificationInput'
      responses:
        '200':
          description: The verified change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/attachments:
    post:
      operationId: addChangeAttachment
      summary: Attach a supporting file to a submitted change (E-3, M5.2)
      description: >-
        The file goes to private storage under its SHA-256. Allowed are PDF, pictures (PNG, JPEG), Excel, Word,
        Outlook messages, text, and CSV, up to 20 MB.
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The change after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/attachments/{attachmentId}:
    get:
      operationId: getChangeAttachment
      summary: Download one attachment of a change (L-4)
      parameters:
        - $ref: '#/components/parameters/ChangeId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: The file, always as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeChangeAttachment
      summary: Remove one attachment from a submitted change (E-3)
      description: The record stays in the audit log; the file can no longer be downloaded.
      parameters:
        - $ref: '#/components/parameters/ChangeId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: The change after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/changes:
    get:
      operationId: listDocumentChanges
      summary: The changes that affect one document, newest first (L-4)
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/sections:
    post:
      operationId: addDocumentSection
      summary: Add a section, one PCB of the model, to every document of the set (E-2, D-155)
      description: >-
        A section has a name and part numbers chosen from the part numbers of the document; one section may hold two
        part numbers (R and L). The section is added to the PFD, PFMEA, and CP of the set with the same key. When it is
        the first section, the rows already there move into it. Once a set has sections, every new row names its
        section, and composition, order, operation numbers, relevant documents, and the PFMEA to CP check work per
        section.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDocumentSection'
      responses:
        '201':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/sections/{sectionId}:
    put:
      operationId: updateDocumentSection
      summary: Rename, move, or change the part numbers of a section in every document of the set (E-2, D-155)
      description: Fields left out stay as they are, except the name, which is required (D-111).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/SectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSectionUpdate'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeDocumentSection
      summary: Remove an empty section from every document of the set (E-2, D-155)
      description: A section that still has rows gives 422 with code not_allowed on field section.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/SectionId'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/references:
    post:
      operationId: fillDocumentReferences
      summary: Fill the empty Relevant Document cells from the master list (E-2, D-130)
      description: >-
        The first row of each process gets the numbers of the documents linked to that process for the model of the
        document, one per line. Cells that already hold text are left as they are. Composing a document does the same.
        A form without a Relevant Document column gives 422 with code not_allowed on field format.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/rows:
    post:
      operationId: addDocumentRow
      summary: Add a row at the end of a draft document (E-2)
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRowInput'
      responses:
        '201':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/rows/batch:
    post:
      operationId: addDocumentRows
      summary: Add several rows at the end of a draft document, as pasted from Excel (E-2, M4.4)
      description: >-
        All rows are added in the order given, or none at all. A problem names its row, for example
        rows[2].<field id> (R-MIG-02).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRowBatch'
      responses:
        '201':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/rows/{rowId}:
    delete:
      operationId: deleteDocumentRow
      summary: Remove one row of a draft document (E-2, M4.2)
      description: The rows after it move up one place; the IDs of other rows stay.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RowId'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateDocumentRow
      summary: Replace the process, operation number, and content of one row (E-2)
      description: The row keeps its ID and position (R-DOC-02).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRowInput'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/form-sets:
    get:
      operationId: listFormSets
      summary: Form sets with their versions, and the form set of each customer (L-2, D-133)
      responses:
        '200':
          description: The form sets, the default one first, and the choice of each customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSetList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createFormSet
      summary: Add a form set with a draft version 1 (A-2, D-133)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFormSet'
      responses:
        '201':
          description: The form set was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSet'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/form-sets/{formSetId}/versions:
    post:
      operationId: createFormSetVersion
      summary: Make the next draft version of a form set from its last published version (A-2)
      parameters:
        - $ref: '#/components/parameters/FormSetId'
      responses:
        '201':
          description: The form set with the new draft version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSet'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/form-set-versions/{formSetVersionId}:
    put:
      operationId: setFormSetSheets
      summary: Choose the format template versions of the sheets of a draft form set version (A-2)
      parameters:
        - $ref: '#/components/parameters/FormSetVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormSetSheets'
      responses:
        '200':
          description: The form set after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSet'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/form-set-versions/{formSetVersionId}/publish:
    post:
      operationId: publishFormSetVersion
      summary: Approve and publish a draft form set version (V-3, D-139)
      description: >-
        Only a holder of V-3 who did not prepare the draft. All format template versions of the form set must be
        published first. A published version cannot be changed.
      parameters:
        - $ref: '#/components/parameters/FormSetVersionId'
      responses:
        '200':
          description: The form set with the published version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSet'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/customers/{customerId}/default-form-set:
    put:
      operationId: setCustomerFormSet
      summary: Choose the form set for new documents of a customer (A-2, D-133)
      description: Without form_set_id the customer uses the default form set of the system.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerFormSetChoice'
      responses:
        '204':
          description: The choice was saved.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-templates:
    get:
      operationId: listProcessTemplates
      summary: Process templates with a summary of their versions (L-2, UC-21, R-TPL-01)
      responses:
        '200':
          description: The process templates, by process name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplateList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProcessTemplate
      summary: Add the process template of a process, with an empty draft version 1 (E-6, UC-21, D-64)
      description: A process has at most one process template for now (working assumption E-72).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProcessTemplate'
      responses:
        '201':
          description: The process template was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplate'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-templates/{processTemplateId}/versions:
    post:
      operationId: createProcessTemplateVersion
      summary: Make the next draft version of a process template from its last published version (E-6, R-TPL-05)
      description: >-
        The new version copies the sub-processes, points, and variants of the last version, with the same IDs.
        Refused with 409 while the template still has a draft version.
      parameters:
        - $ref: '#/components/parameters/ProcessTemplateId'
      responses:
        '201':
          description: The new draft version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplateVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-template-versions/{processVersionId}/publish:
    post:
      operationId: publishProcessTemplateVersion
      summary: Publish a draft version of a process template (E-6, R-TPL-05)
      description: A published version cannot be changed. Changes go into a new version. Refused with 409 if it is already published.
      parameters:
        - $ref: '#/components/parameters/ProcessVersionId'
      responses:
        '200':
          description: The published version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplateVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-template-versions/{processVersionId}:
    get:
      operationId: getProcessTemplateVersion
      summary: One process template version with its sub-processes and points (L-2)
      parameters:
        - $ref: '#/components/parameters/ProcessVersionId'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplateVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-template-versions/{processVersionId}/subprocesses:
    post:
      operationId: addSubprocess
      summary: Add a sub-process at the end of a draft version (E-6)
      parameters:
        - $ref: '#/components/parameters/ProcessVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSubprocess'
      responses:
        '201':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplateVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-template-versions/{processVersionId}/subprocesses/{subprocessId}:
    put:
      operationId: updateSubprocess
      summary: Rename, move, hide, or show a sub-process in a draft version (E-6)
      description: |
        The sub-process ID never changes, so its points and every reference
        stay intact. Sub-processes are hidden, never deleted. A field that is
        not sent stays as it is.
      parameters:
        - $ref: '#/components/parameters/ProcessVersionId'
        - $ref: '#/components/parameters/SubprocessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubprocessUpdate'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplateVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-template-versions/{processVersionId}/points:
    post:
      operationId: addTemplatePoint
      summary: Add a point for PFD, PFMEA, or CP at the end of a sub-process in a draft version (E-6, R-TPL-04)
      parameters:
        - $ref: '#/components/parameters/ProcessVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTemplatePoint'
      responses:
        '201':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplateVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-template-versions/{processVersionId}/points/{pointId}:
    put:
      operationId: updateTemplatePoint
      summary: Change the text of a point, move, hide, or show it in a draft version (E-6, R-TPL-04)
      description: |
        The point ID, its sub-process, and its document type never change.
        Points are hidden, never deleted. A field that is not sent stays as
        it is.
      parameters:
        - $ref: '#/components/parameters/ProcessVersionId'
        - $ref: '#/components/parameters/PointId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePointUpdate'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplateVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-template-versions/{processVersionId}/points/{pointId}/variants:
    post:
      operationId: addPointVariant
      summary: Add a variant of a point for a narrower scope in a draft version (E-6, M3.3, D-129)
      description: |
        A variant holds the text of the point for one customer, model group,
        or model, for example the laser type of one model while the point is
        usually general. The variant must be narrower than its point and inside
        it, and one scope has at most one variant of the same point. The scope
        never changes after the variant is made.
      parameters:
        - $ref: '#/components/parameters/ProcessVersionId'
        - $ref: '#/components/parameters/PointId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPointVariant'
      responses:
        '201':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplateVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-template-versions/{processVersionId}/variants/{variantId}:
    put:
      operationId: updatePointVariant
      summary: Change the text of a variant, hide, or show it in a draft version (E-6, M3.3)
      description: |
        The variant ID, its point, and its scope never change. Variants are
        hidden, never deleted. A hidden variant does not count, so its model
        uses the next broader level.
      parameters:
        - $ref: '#/components/parameters/ProcessVersionId'
        - $ref: '#/components/parameters/VariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointVariantUpdate'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTemplateVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/process-template-versions/{processVersionId}/resolved:
    get:
      operationId: resolveProcessTemplatePoints
      summary: The points of a version that apply to one model (L-2 for the customer of the model, M3.3, R-TPL-03)
      description: |
        For each visible point that applies to the model, the most specific
        visible variant wins: model, then model group, then customer, then the
        point itself. Hidden sub-processes and points are left out.
      parameters:
        - $ref: '#/components/parameters/ProcessVersionId'
        - name: model_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The points that apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPoints'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/system-settings:
    get:
      operationId: getSystemSettings
      summary: System settings, today the sign date switch (D-52)
      responses:
        '200':
          description: The system settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSystemSettings
      summary: Change the system settings (A-3, UC-07)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsUpdate'
      responses:
        '200':
          description: The system settings were changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/audit-log:
    get:
      operationId: listAuditLog
      summary: Audit log entries, newest first (A-4, admin account only)
      description: |
        Every change of data writes one entry (R-SEC-03). The entries form one
        hash chain: the hash of each entry covers its content and the hash of
        the entry before it. Give `next_before` from the response as `before`
        to read older entries.
      parameters:
        - name: before
          in: query
          description: Return entries with a lower number than this. Leave it out for the newest entries.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          description: Number of entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Audit log entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/audit-log/verification:
    get:
      operationId: verifyAuditLog
      summary: Check the whole hash chain of the audit log (A-4, admin account only)
      responses:
        '200':
          description: The result of the check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    CustomerIdQuery:
      name: customer_id
      in: query
      required: true
      description: The customer whose master data is listed.
      schema:
        type: string
    DocumentTypeIdQuery:
      name: document_type_id
      in: query
      required: true
      description: The document type, PFD, PFMEA, or CP.
      schema:
        type: string
    DocumentNumberId:
      name: documentNumberId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Required by the server (422 idempotency_key:required when missing).
        1 to 100 characters - letters, digits, `.`, `:`, `_`, `-` - for example a UUID.
        It is kept per account.
      schema:
        type: string
    ProjectGroupId:
      name: projectGroupId
      in: path
      required: true
      schema:
        type: string
    ModelGroupId:
      name: modelGroupId
      in: path
      required: true
      schema:
        type: string
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
    PartNumberId:
      name: partNumberId
      in: path
      required: true
      schema:
        type: string
    ProcessId:
      name: processId
      in: path
      required: true
      schema:
        type: string
    DocumentTypeId:
      name: documentTypeId
      in: path
      required: true
      schema:
        type: string
    SpecialCodeId:
      name: specialCodeId
      in: path
      required: true
      schema:
        type: string
    ChangeTypeId:
      name: changeTypeId
      in: path
      required: true
      schema:
        type: string
    ChangeSourceId:
      name: changeSourceId
      in: path
      required: true
      schema:
        type: string
    FourMCategoryId:
      name: fourMCategoryId
      in: path
      required: true
      schema:
        type: string
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
    HolderId:
      name: holderId
      in: path
      required: true
      schema:
        type: string
    ApprovalRouteId:
      name: approvalRouteId
      in: path
      required: true
      schema:
        type: string
    FormatTemplateId:
      name: formatTemplateId
      in: path
      required: true
      schema:
        type: string
    FormatVersionId:
      name: formatVersionId
      in: path
      required: true
      schema:
        type: string
    FormatFieldId:
      name: formatFieldId
      in: path
      required: true
      schema:
        type: string
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
    ChangeId:
      name: changeId
      in: path
      required: true
      schema:
        type: string
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
    RefDocId:
      name: refDocId
      in: path
      required: true
      schema:
        type: string
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
    RowId:
      name: rowId
      in: path
      required: true
      schema:
        type: string
    FormSetId:
      name: formSetId
      in: path
      required: true
      schema:
        type: string
    FormSetVersionId:
      name: formSetVersionId
      in: path
      required: true
      schema:
        type: string
    ProcessTemplateId:
      name: processTemplateId
      in: path
      required: true
      schema:
        type: string
    ProcessVersionId:
      name: processVersionId
      in: path
      required: true
      schema:
        type: string
    SubprocessId:
      name: subprocessId
      in: path
      required: true
      schema:
        type: string
    PointId:
      name: pointId
      in: path
      required: true
      schema:
        type: string
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-revioten_session
  responses:
    Error:
      description: |
        The request failed. `code` says why: `invalid_request` (400, the body
        cannot be read as JSON), `validation_failed` (422, see `details`),
        `conflict` (409, for example the code is already used), `not_found`
        (404), `method_not_allowed` (405), `unauthenticated` (401, no valid
        session), `invalid_credentials` (401, login failed),
        `password_change_required` (403, change the password first),
        `forbidden` (403, the caller lacks the right or the request came
        from another site), or `internal_error` (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unreachable]
    Customer:
      type: object
      required: [id, code, name, active, codes, created_at]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        code:
          type: string
          description: Current customer code used in document numbers, for example SC-AB-001.
          pattern: '^[A-Z]{2}$'
          example: AB
        name:
          type: string
          example: Example Customer
        default_route:
          $ref: '#/components/schemas/ApprovalRouteRef'
        project_group:
          $ref: '#/components/schemas/ProjectGroupRef'
        active:
          type: boolean
          description: Customers are never deleted; inactive customers get no new models (E-09).
        codes:
          type: array
          description: All codes of the customer, oldest first. The last one is the current code (E-11).
          items:
            $ref: '#/components/schemas/CustomerCode'
        created_at:
          type: string
          format: date-time
    CustomerCode:
      type: object
      required: [code, valid_from]
      properties:
        code:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          description: Missing for the current code.
    ProjectGroupRef:
      type: object
      required: [id, code]
      description: |
        The project group of the customer (D-54). Missing only for customers
        added before project groups existed.
      properties:
        id:
          type: string
        code:
          type: string
    Credentials:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: admin.example
        password:
          type: string
          format: password
    Session:
      type: object
      required: [account, person, must_change_password, permissions]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        person:
          $ref: '#/components/schemas/Person'
        must_change_password:
          type: boolean
          description: |
            True after an admin reset the password. Until the password is
            changed, other operations answer 403 `password_change_required`.
        permissions:
          type: array
          description: |
            The rights of the caller, as codes from the user map (U3), for
            example L-1 or A-2. Screens use them to show or hide actions; the
            server still checks every operation.
          items:
            type: string
    Account:
      type: object
      required: [id, login, kind]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        login:
          type: string
        kind:
          type: string
          description: A work account, or the separate admin account (D-72).
          enum: [work, admin]
    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        name:
          type: string
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          description: |
            15 to 128 characters. Common passwords and passwords that contain
            the login name, the person name, or the system name are refused.
    RoleGrant:
      type: object
      required: [role, scope]
      properties:
        role:
          type: string
          description: Role ID, for example author or verifier.
        scope:
          type: string
          description: |
            `all` for all customers, or `own_project_group` for the customers
            of the project group where the person is Project Leader or
            Project Engineer (D-71). Only author and verifier can use
            `own_project_group`.
          enum: [all, own_project_group]
    Role:
      type: object
      required: [id, level, permissions]
      properties:
        id:
          type: string
        level:
          type: string
          enum: [view, edit, verify, admin]
        permissions:
          type: array
          items:
            type: string
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    AccountInfo:
      type: object
      required: [id, kind, login, person, roles, must_change_password, disabled, created_at]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        kind:
          type: string
          enum: [work, admin]
        login:
          type: string
        person:
          $ref: '#/components/schemas/PersonInfo'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        must_change_password:
          type: boolean
        locked_until:
          type: string
          format: date-time
          description: Set while the account is locked after failed logins.
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    PersonInfo:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        name:
          type: string
        employee_number:
          type: string
    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountInfo'
    NewAccount:
      type: object
      required: [kind, login]
      description: |
        Give `person_id` for a person who already has an account (for example
        an admin account for the PPAP Staff, D-72), or `person_name` for a
        new person, not both.
      properties:
        person_id:
          type: string
        person_name:
          type: string
        employee_number:
          type: string
        kind:
          type: string
          enum: [work, admin]
        login:
          type: string
        roles:
          type: array
          description: Roles of a work account. An admin account always holds only the admin role.
          items:
            $ref: '#/components/schemas/RoleGrant'
    CreatedAccount:
      type: object
      required: [account, temporary_password]
      properties:
        account:
          $ref: '#/components/schemas/AccountInfo'
        temporary_password:
          type: string
          description: Shown only once. Give it to the owner of the account.
    TemporaryPassword:
      type: object
      required: [temporary_password]
      properties:
        temporary_password:
          type: string
          description: Shown only once. Give it to the owner of the account.
    RolesUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
    AuditEntry:
      type: object
      required: [seq, occurred_at, actor, action, details, prev_hash, hash]
      properties:
        seq:
          type: integer
          format: int64
          description: Number in the chain, starting at 1, without gaps.
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          type: string
          description: Event code, for example account.created or customer.created.
        target:
          $ref: '#/components/schemas/AuditTarget'
        details:
          type: object
          additionalProperties:
            type: string
          description: Never contains passwords, tokens, or keys.
        request_id:
          type: string
        source_ip:
          type: string
        prev_hash:
          type: string
          description: Hash of the entry before this one (64 zeros for the first entry).
        hash:
          type: string
          description: SHA-256 of this entry and prev_hash, 64 lowercase hexadecimal characters.
    AuditActor:
      type: object
      required: [type]
      description: |
        `human` is a logged-in account, shown with the person who holds it
        (D-74). `system` is a command on the server computer, for example
        create-admin. `anonymous` is someone who is not logged in, for
        example a failed login.
      properties:
        type:
          type: string
          enum: [human, system, anonymous]
        account_id:
          type: string
        login:
          type: string
        person_id:
          type: string
        person_name:
          type: string
    AuditTarget:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          description: What the entry is about, for example account or customer.
        id:
          type: string
        label:
          type: string
          description: Display name, for example the login of an account or the code of a customer.
    AuditEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_before:
          type: integer
          format: int64
          description: Give this as `before` to read older entries. Missing when there are no older entries.
    AuditVerification:
      type: object
      required: [valid, entries]
      properties:
        valid:
          type: boolean
        entries:
          type: integer
          format: int64
          description: Number of entries checked.
        last_seq:
          type: integer
          format: int64
        last_hash:
          type: string
          description: |
            Hash of the last entry. Noted outside the system, it also reveals
            a removed last entry later.
        broken_seq:
          type: integer
          format: int64
          description: The first entry that does not fit the chain.
        reason:
          type: string
          enum: [sequence_gap, link_mismatch, hash_mismatch]
          description: |
            `sequence_gap`: a number is missing, so an entry was removed.
            `link_mismatch`: prev_hash differs from the hash of the entry before.
            `hash_mismatch`: the content no longer matches the hash, so it was changed.
    NewCustomer:
      type: object
      required: [code, name, project_group_id]
      properties:
        code:
          type: string
          description: |
            Two letters A to Z. Spaces around the code are removed and letters
            are made uppercase. ZZ is reserved for general documents.
          example: ab
        name:
          type: string
          description: 1 to 200 characters after spaces around it are removed.
          example: Example Customer
        project_group_id:
          type: string
          description: Each customer is allocated to one project group (D-54).
    CustomerUpdate:
      type: object
      required: [name, project_group_id]
      properties:
        name:
          type: string
        project_group_id:
          type: string
        active:
          type: boolean
          # E-34 (D-111): opsional, supaya klien yang lupa mengirimnya tidak
          # menonaktifkan customer tanpa sengaja.
          description: Leave it out to keep the current status.
    CustomerCodeChange:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: |
            Two letters A to Z. A code that another customer uses, or used
            before, is refused.
    ProjectGroup:
      type: object
      required: [id, code, name, created_at]
      properties:
        id:
          type: string
        code:
          type: string
          example: GR1
        name:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectGroupInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: 1 to 10 letters A to Z or digits, made uppercase, for example GR1.
        name:
          type: string
    ProjectGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectGroup'
    ModelGroup:
      type: object
      required: [id, customer_id, name, created_at]
      description: A named set of models of one customer that share template content (D-39, D-42).
      properties:
        id:
          type: string
        customer_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    NewModelGroup:
      type: object
      required: [customer_id, name]
      properties:
        customer_id:
          type: string
        name:
          type: string
          description: 1 to 200 characters, unique within the customer.
    ModelGroupUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ModelGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelGroup'
    Model:
      type: object
      required: [id, customer_id, name, created_at]
      properties:
        id:
          type: string
        customer_id:
          type: string
        model_group:
          $ref: '#/components/schemas/ModelGroupRef'
        name:
          type: string
        created_at:
          type: string
          format: date-time
    ModelGroupRef:
      type: object
      required: [id, name]
      description: The model group of the model. Missing when the model is in no group.
      properties:
        id:
          type: string
        name:
          type: string
    NewModel:
      type: object
      required: [customer_id, name]
      properties:
        customer_id:
          type: string
        name:
          type: string
          description: 1 to 200 characters, unique within the customer.
        model_group_id:
          type: string
          description: A model group of the same customer. Leave it out for no group.
    ModelUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        model_group_id:
          type: string
          description: Leave it out to take the model out of its group.
    ModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    PartNumber:
      type: object
      required: [id, customer_id, model, number, created_at]
      properties:
        id:
          type: string
        customer_id:
          type: string
        model:
          $ref: '#/components/schemas/ModelRef'
        number:
          type: string
        name:
          type: string
          description: Name of the part, for example the description on the PFMEA.
        created_at:
          type: string
          format: date-time
    ModelRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    NewPartNumber:
      type: object
      required: [model_id, number]
      properties:
        model_id:
          type: string
        number:
          type: string
          description: 1 to 100 characters, unique within the customer of the model.
        name:
          type: string
    PartNumberUpdate:
      type: object
      required: [number]
      properties:
        number:
          type: string
        name:
          type: string
          description: Leave it out to remove the name.
    PartNumberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartNumber'
    Process:
      type: object
      required: [id, name, aliases, created_at]
      description: |
        A manufacturing step, for example IQC (D-06, R-DOC-04). The ID never
        changes; the name is only a display value. Other data refers to the
        process by its ID.
      properties:
        id:
          type: string
        name:
          type: string
        aliases:
          type: array
          description: Other names of the same process, for example the name used in an older document, ordered alphabetically.
          items:
            type: string
        created_at:
          type: string
          format: date-time
    NewProcess:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            1 to 200 characters. Repeated spaces become one. Names and aliases
            of all processes share one namespace, ignoring case: a name used
            by any process, as a name or an alias, is taken.
        aliases:
          type: array
          maxItems: 20
          description: Leave it out for no aliases. Each alias follows the rules of the name.
          items:
            type: string
    ProcessUpdate:
      type: object
      required: [name, aliases]
      properties:
        name:
          type: string
        aliases:
          type: array
          maxItems: 20
          description: Replaces all aliases of the process. Send an empty list to remove them.
          items:
            type: string
    ProcessList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Process'
    NumberSettings:
      type: object
      required: [factory_code, pattern, sequence_format, revision_digits]
      properties:
        factory_code:
          type: string
          description: One letter A to Z, the first letter of every number prefix (E-12).
          example: S
        pattern:
          type: string
          description: |
            Number pattern for new numbers (R-NUM-02, M2.1) with the tokens
            {prefix} (factory code and document type letter), {customer}, and
            {seq} (running number), separated by punctuation.
          example: '{prefix}-{customer}-{seq}'
        sequence_format:
          type: string
          enum: [letter_block]
          description: Running number format - 001 to 999, then A001 to A999, B001, up to Z999 (D-89).
        revision_digits:
          type: integer
          description: Digits of the revision label, for example 2 for -04 (R-REV-01).
          example: 2
    NumberSettingsUpdate:
      type: object
      required: [factory_code]
      properties:
        factory_code:
          type: string
        pattern:
          type: string
          description: Leave it out to keep the current pattern.
        revision_digits:
          type: integer
          description: 1 to 3. Leave it out to keep the current value.
    NewDocumentNumber:
      type: object
      required: [customer_id, document_type_id]
      properties:
        customer_id:
          type: string
        document_type_id:
          type: string
          description: PFD, PFMEA, or CP. Other document types are not numbered by the system.
        initial_revision:
          type: integer
          description: First revision of the document that uses the number, for example 4 for a legacy document entering at -04 (M2.4). Default 0.
    NewDocumentNumberSet:
      type: object
      required: [customer_id]
      properties:
        customer_id:
          type: string
        initial_revision:
          type: integer
          description: First revision of the three documents, for example 4 for -04. Default 0.
    NextDocumentNumber:
      type: object
      required: [number]
      properties:
        number:
          type: string
          example: SC-AB-001
    NumberRegistration:
      type: object
      required: [items, replayed]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentNumber'
        replayed:
          type: boolean
          description: True when the Idempotency-Key was used before for the same request.
    DocumentNumber:
      type: object
      required: [id, number, customer, customer_code, document_type, sequence, status, initial_revision, revision_label, origin, batch_id, registered_by, created_at]
      description: One number in the register (R-NUM-04). Numbers are never deleted or reused; only the status changes.
      properties:
        id:
          type: string
        number:
          type: string
          description: The number as registered. It is never recomputed (R-NUM-02).
          example: SC-AB-001
        customer:
          $ref: '#/components/schemas/CustomerRef'
        customer_code:
          type: string
          description: The customer code inside the number. An older code when the customer code was changed later (E-11).
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        sequence:
          type: integer
          description: Value of the running number, for example 1 for 001 and 1000 for A001.
        status:
          type: string
          enum: [reserved, in_use, released, obsolete, void, skipped]
        initial_revision:
          type: integer
        revision_label:
          type: string
          description: The initial revision as printed, for example -04.
        origin:
          type: string
          enum: [single, set, import]
          description: How the number entered the register. Numbers of one set share batch_id.
        batch_id:
          type: string
        registered_by:
          $ref: '#/components/schemas/Person'
        status_reason:
          type: string
          description: Reason given when the number was voided or made obsolete.
        status_changed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    DocumentNumberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentNumber'
        next_before:
          type: string
          description: Give this as `before` to read the next page. Missing on the last page.
    StatusReason:
      type: object
      properties:
        reason:
          type: string
          description: Required to void a number; optional to make it obsolete. One line, at most 500 characters.
    NumberImportRequest:
      type: object
      required: [customer_id, status, text]
      properties:
        customer_id:
          type: string
        status:
          type: string
          enum: [reserved, in_use, released, obsolete, void]
          description: The status of every number in this import.
        text:
          type: string
          description: Legacy numbers, one per line, at most 5000 lines that are not blank.
        dry_run:
          type: boolean
          description: True to get the report without saving anything. Default false.
    NumberImportReport:
      type: object
      required: [dry_run, status, imported, lines, groups, misaligned]
      properties:
        dry_run:
          type: boolean
        status:
          type: string
          enum: [reserved, in_use, released, obsolete, void]
        imported:
          type: integer
          description: Numbers imported, or the numbers a dry run would import.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/NumberImportLine'
        groups:
          type: array
          description: The register of each customer code (old codes first) and document type after the import.
          items:
            $ref: '#/components/schemas/NumberImportGroup'
        misaligned:
          type: array
          description: Running numbers that only some of PFD, PFMEA, and CP have. Skipped numbers do not count.
          items:
            $ref: '#/components/schemas/NumberMisalignment'
    NumberImportLine:
      type: object
      required: [line, text, result]
      properties:
        line:
          type: integer
          description: The line in the pasted text, from 1. Blank lines are left out.
        text:
          type: string
          description: The first column of the line, without surrounding spaces.
        result:
          type: string
          enum: [imported, existing, duplicate, customer_mismatch, invalid]
        first_line:
          type: integer
          description: For a duplicate, the line where the number first appears.
    NumberImportGroup:
      type: object
      required: [customer_code, document_type, count, gaps]
      properties:
        customer_code:
          type: string
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        count:
          type: integer
          description: Numbers in the register, all statuses.
        highest:
          type: string
          description: The highest running number, for example 007. Missing when count is 0.
        gaps:
          type: array
          description: Running numbers missing from 001 to the highest. They are reported, never filled.
          items:
            $ref: '#/components/schemas/SequenceRange'
    NumberMisalignment:
      type: object
      required: [customer_code, range, present]
      properties:
        customer_code:
          type: string
        range:
          $ref: '#/components/schemas/SequenceRange'
        present:
          type: array
          description: The document types that have a number in this range.
          items:
            $ref: '#/components/schemas/DocumentTypeRef'
    SequenceRange:
      type: object
      required: [first, last]
      properties:
        first:
          type: string
          example: '003'
        last:
          type: string
          example: '006'
    CustomerRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
        code:
          type: string
          description: The current customer code.
        name:
          type: string
    DocumentTypeRef:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [pfd, pfmea, cp]
        name:
          type: string
    DocumentType:
      type: object
      required: [id, name, letter, prefix]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [pfd, pfmea, cp]
          description: Set for the documents this system builds. Missing for other document types from the WI.
        name:
          type: string
        letter:
          type: string
          description: One letter A to Z, unique among document types.
        prefix:
          type: string
          description: The factory code followed by the letter, for example SH.
    DocumentTypeInput:
      type: object
      required: [name, letter]
      properties:
        name:
          type: string
          description: 1 to 200 characters, unique among document types, ignoring case.
        letter:
          type: string
    DocumentTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'
    SpecialCode:
      type: object
      required: [id, code, name, created_at]
      properties:
        id:
          type: string
        code:
          type: string
          description: Two or three letters A to Z, used in place of a customer code, for example ZZ.
        name:
          type: string
        created_at:
          type: string
          format: date-time
    NewSpecialCode:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    SpecialCodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpecialCode'
    NameUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 200 characters, unique within its list, ignoring case.
    ChangeType:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [content, layout, administrative]
        name:
          type: string
        approval_route:
          $ref: '#/components/schemas/ApprovalRouteRef'
    ChangeTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeType'
    ChangeSource:
      type: object
      required: [id, name, active, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        mechanism:
          type: string
          enum: [yokoten, template, sqam]
          description: Set when the system itself creates changes with this source. Such a source stays active.
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    ChangeSourceUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        active:
          type: boolean
          description: Leave it out to keep the current status.
    ChangeSourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeSource'
    FourMCategory:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [man, machine, material, method]
        name:
          type: string
    FourMCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FourMCategory'
    Position:
      type: object
      required: [id, key, name, per_project_group, single_holder, holders]
      description: A job title in the approval workflow (D-54). The key never changes; the name may (D-58).
      properties:
        id:
          type: string
        key:
          type: string
          enum: [ppap_engineer, ppap_staff, project_engineer, project_leader, apqp_ppap_controller, npi_manager, qa_qc_manager, advisor, factory_manager]
        name:
          type: string
        per_project_group:
          type: boolean
          description: True for the Project Leader and the Project Engineer, who are held once per project group.
        single_holder:
          type: boolean
          description: |
            True for the approver positions and the APQP/PPAP Controller, which
            have one holder only (D-115). A second holder is refused with
            409 conflict, detail position_id:taken.
        holders:
          type: array
          items:
            $ref: '#/components/schemas/PositionHolder'
    PositionHolder:
      type: object
      required: [id, person, created_at]
      properties:
        id:
          type: string
        person:
          $ref: '#/components/schemas/Person'
        project_group:
          $ref: '#/components/schemas/ProjectGroupRef'
        created_at:
          type: string
          format: date-time
    NewPositionHolder:
      type: object
      required: [person_id]
      properties:
        person_id:
          type: string
        project_group_id:
          type: string
          description: Required for positions held per project group, and not allowed for other positions.
    PositionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    ApprovalRoute:
      type: object
      required: [id, name, slots, created_at]
      description: An ordered list of signature slots (R-APR-08). One Prepared slot, one Checked slot, then one or more Approved slots (D-45, D-48, D-49).
      properties:
        id:
          type: string
        name:
          type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/RouteSlot'
        created_at:
          type: string
          format: date-time
    RouteSlot:
      type: object
      required: [stage, print_title, positions]
      properties:
        stage:
          type: string
          enum: [prepared, checked, approved]
        print_title:
          type: string
          description: Printed under the holder's name, separate from the position name (R-APR-17, D-76).
        positions:
          type: array
          description: The positions allowed to sign this slot.
          items:
            $ref: '#/components/schemas/PositionRef'
    PositionRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    ApprovalRouteInput:
      type: object
      required: [name, slots]
      properties:
        name:
          type: string
          description: 1 to 200 characters, unique among approval routes, ignoring case.
        slots:
          type: array
          maxItems: 10
          description: The slots in signing order. On update the list replaces all slots.
          items:
            $ref: '#/components/schemas/RouteSlotInput'
    RouteSlotInput:
      type: object
      required: [stage, print_title, position_ids]
      properties:
        stage:
          type: string
          enum: [prepared, checked, approved]
        print_title:
          type: string
          description: 1 to 100 characters.
        position_ids:
          type: array
          items:
            type: string
    ApprovalRouteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRoute'
    ApprovalRouteRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    RouteChoice:
      type: object
      required: [route_id]
      properties:
        route_id:
          type: string
    ChangeTypeRouteChoice:
      type: object
      properties:
        route_id:
          type: string
          description: Leave it out to use the default route of each customer.
    FormatTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FormatTemplate'
    FormatTemplate:
      type: object
      required: [id, name, document_type, versions, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        methodology:
          type: string
          enum: [aiag_4th, aiag_vda, sqam, aiag_cp_2024]
          description: Missing for the forms in use today (PFD, CP).
        customer_id:
          type: string
          description: Missing for a general format template; set for a customer SQAM format.
        customer_code:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/FormatVersionSummary'
        created_at:
          type: string
          format: date-time
    FormatVersionSummary:
      type: object
      required: [id, version, status, risk_method]
      properties:
        id:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, published]
        risk_method:
          type: string
          enum: [rpn, ap, none]
        published_at:
          type: string
          format: date-time
          description: When the version was published. Absent while it is a draft (M3.4).
    NewFormatTemplate:
      type: object
      required: [name, document_type_id]
      properties:
        name:
          type: string
        document_type_id:
          type: string
        methodology:
          type: string
          enum: [aiag_4th, aiag_vda, sqam, aiag_cp_2024]
        customer_id:
          type: string
        risk_method:
          type: string
          enum: [rpn, ap, none]
          description: Required without copy_from_version_id; a copy takes the risk method of its source.
        copy_from_version_id:
          type: string
    FormatTemplateRename:
      type: object
      required: [name]
      properties:
        name:
          type: string
    DocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
    DocumentSummary:
      type: object
      required: [id, number, document_type, revision, status, form_set_name, row_count, models, updated_at]
      properties:
        models:
          type: array
          description: The names of the models of the document, in alphabetical order (M4.7).
          items:
            type: string
        id:
          type: string
        number:
          type: string
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        revision:
          type: integer
        status:
          type: string
          enum: [draft, released]
          description: Draft while a draft revision is open; released when there is none (M5.4).
        form_set_name:
          type: string
        row_count:
          type: integer
        updated_at:
          type: string
          format: date-time
    NewDocument:
      type: object
      required: [document_number_id, model_ids]
      properties:
        document_number_id:
          type: string
        model_ids:
          type: array
          items:
            type: string
        part_number_ids:
          type: array
          items:
            type: string
        route_id:
          type: string
          description: Leave it out to use the default route of the customer.
        route_reason:
          type: string
          description: Required when route_id is not the default route of the customer (D-47).
    Document:
      type: object
      required: [id, document_number_id, number, customer_id, customer_code, document_type, revision, status, form_set_version_id, form_set_name, format_version_id, models, part_numbers, header, header_version, rows, sections, set, created_at, updated_at]
      properties:
        id:
          type: string
        document_number_id:
          type: string
        number:
          type: string
        customer_id:
          type: string
        customer_code:
          type: string
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        revision:
          type: integer
        status:
          type: string
          enum: [draft, released]
          description: Draft while a draft revision is open; released when there is none (M5.4).
        released_revision:
          type: integer
          description: The revision in force. Missing until the first release.
        form_set_version_id:
          type: string
        form_set_name:
          type: string
        format_version_id:
          type: string
          description: The format template version of the sheet of this document.
        models:
          type: array
          items:
            $ref: '#/components/schemas/NamedRef'
        part_numbers:
          type: array
          items:
            $ref: '#/components/schemas/DocumentPartNumber'
        route:
          $ref: '#/components/schemas/NamedRef'
        route_reason:
          type: string
        header:
          type: object
          additionalProperties: true
          description: Header content keyed by header field ID.
        header_version:
          type: integer
          description: Goes up by one each time the header is saved. Send it back when saving the header (R-DOC-07).
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRow'
        sections:
          type: array
          description: The sections of the document, one per PCB of the model (D-155), in order. Empty for a document without sections.
          items:
            $ref: '#/components/schemas/DocumentSection'
        set:
          type: array
          description: >-
            The documents of the same set, this one included, by document type (M4.2). Documents from numbers registered
            as a set of PFD, PFMEA, and CP know each other; a single number gives only this document.
          items:
            $ref: '#/components/schemas/DocumentSetMember'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DocumentSetMember:
      type: object
      required: [id, number, document_type]
      properties:
        id:
          type: string
        number:
          type: string
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    DocumentPartNumber:
      type: object
      required: [id, number]
      properties:
        id:
          type: string
        number:
          type: string
        name:
          type: string
    DocumentRow:
      type: object
      required: [id, position, version, operation_manual, detached, content]
      properties:
        id:
          type: string
          description: Fixed for the life of the row (R-DOC-02).
        position:
          type: integer
        version:
          type: integer
          description: Goes up by one each time the row is saved. Send it back when changing the row (R-DOC-07).
        process_id:
          type: string
        process_name:
          type: string
        operation_number:
          type: string
        operation_manual:
          type: boolean
          description: The operation number was typed or pasted, so automatic numbering keeps it (M4.6).
        detached:
          type: boolean
          description: The link to the template point was cut, with a reason (M4.8).
        section_id:
          type: string
          description: The section of the row (D-155); left out for a document without sections.
        detach_reason:
          type: string
        content:
          type: object
          additionalProperties: true
          description: Row content keyed by column field ID.
        template_point_id:
          type: string
          description: The process template point this row was composed from; left out for a typed or pasted row (R-CMP-04).
    DocumentRowInput:
      type: object
      required: [content]
      properties:
        process_id:
          type: string
        operation_number:
          type: string
        content:
          type: object
          additionalProperties: true
        section_id:
          type: string
          description: The section of a new row; required when the document has sections (D-155). Ignored when changing a row.
        version:
          type: integer
          description: >-
            The version of the row that was read. Required when changing a row, ignored when adding one. When the row
            was changed by someone else in the meantime the answer is 409 with code changed, and nothing is saved
            (optimistic locking, R-DOC-07).
    Composition:
      type: object
      required: [process_template_version_id, version, process, subprocesses]
      properties:
        process_template_version_id:
          type: string
        version:
          type: integer
        process:
          $ref: '#/components/schemas/NamedRef'
        subprocesses:
          type: array
          items:
            $ref: '#/components/schemas/ComposedSubprocess'
    ComposedSubprocess:
      type: object
      required: [id, name, points]
      properties:
        id:
          type: string
        name:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/ComposedPoint'
    ComposedPoint:
      type: object
      required: [point_id, document_type, text, document_id, state]
      properties:
        point_id:
          type: string
          description: The origin point; rows are linked to this ID.
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        text:
          type: string
          description: The text of the point, or of the variant that applies to the model.
        document_id:
          type: string
          description: The document of the set that receives this point.
        state:
          type: string
          enum: [included, excluded, undecided]
        reason:
          type: string
          description: Why the point is excluded, when a reason was given.
    ComposeInput:
      type: object
      required: [process_template_version_id]
      properties:
        process_template_version_id:
          type: string
        section_key:
          type: string
          description: The section to compose (D-155); required when the set has sections.
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            $ref: '#/components/schemas/PointExclusion'
    PointExclusion:
      type: object
      required: [point_id]
      properties:
        point_id:
          type: string
        reason:
          type: string
    PfmeaCpComparison:
      type: object
      required: [pfmea, cp, processes]
      properties:
        pfmea:
          $ref: '#/components/schemas/Document'
        cp:
          $ref: '#/components/schemas/Document'
        processes:
          type: array
          items:
            $ref: '#/components/schemas/PfmeaCpProcess'
    PfmeaCpProcess:
      type: object
      required: [pfmea_row_ids, cp_row_ids]
      properties:
        section_key:
          type: string
          description: The section (D-155); left out for a set without sections.
        section_name:
          type: string
        process_id:
          type: string
          description: Left out for the rows that have no process.
        process_name:
          type: string
        pfmea_row_ids:
          type: array
          items:
            type: string
        cp_row_ids:
          type: array
          items:
            type: string
        check:
          $ref: '#/components/schemas/PfmeaCpCheck'
    PfmeaCpCheck:
      type: object
      required: [checked_by, checked_at, pfmea_revision, cp_revision, stale]
      properties:
        checked_by:
          type: string
          description: The name of the person who set the mark.
        checked_at:
          type: string
          format: date-time
        pfmea_revision:
          type: integer
        cp_revision:
          type: integer
        stale:
          type: boolean
          description: A row of this process changed after the mark was set, so it should be checked again.
    PfmeaCpCheckInput:
      type: object
      required: [process_id, checked]
      properties:
        section_key:
          type: string
          description: The section (D-155); required when the set has sections.
        process_id:
          type: string
        checked:
          type: boolean
    RowDifferenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RowDifference'
    RowDifference:
      type: object
      required: [row_id, position, point_id, point_text, status, fields]
      properties:
        row_id:
          type: string
        position:
          type: integer
        point_id:
          type: string
        point_text:
          type: string
          description: The text of the point, or of the variant that applies to the model.
        status:
          type: string
          enum: [same, different, detached]
        reason:
          type: string
          description: Why the row was detached.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDifference'
    FieldDifference:
      type: object
      required: [label, template, row]
      properties:
        field_id:
          type: string
          description: The column; left out for the process of the row.
        label:
          type: string
        template:
          description: What the template point writes into this column; an empty string when it writes nothing.
        row:
          description: What the row holds now; an empty string when the cell is empty.
    RowDetach:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    DocumentCopy:
      type: object
      required: [source_document_id]
      properties:
        source_document_id:
          type: string
    DocumentOrder:
      type: object
      required: [row_ids]
      properties:
        section_id:
          type: string
          description: The section to order (D-155); required when the document has sections. Operation numbers start again at 10 per section.
        row_ids:
          type: array
          items:
            type: string
        renumber:
          type: boolean
          description: Number the operations automatically after ordering. Default false.
    ChangeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Change'
    Change:
      type: object
      required: [id, ref, customer_id, customer_code, mechanism, change_type, reason, status, requested_by, documents, attachments, created_at, updated_at]
      properties:
        id:
          type: string
        ref:
          type: string
          description: The reference number of the change, for example CHG-0001.
        customer_id:
          type: string
        customer_code:
          type: string
        mechanism:
          type: string
          enum: [manual, yokoten, template, sqam]
          description: How the change started (D-113). Manual changes are submitted on screen.
        trigger:
          $ref: '#/components/schemas/ChangeRef'
        change_type:
          $ref: '#/components/schemas/ChangeRef'
        four_m:
          $ref: '#/components/schemas/ChangeRef'
        reason:
          type: string
        source_reference:
          type: string
          description: For example a complaint number, an 8D number, an audit finding, or an SQAM revision.
        status:
          type: string
          enum: [submitted, accepted, rejected]
          description: Submitted, then accepted or rejected by a verifier (M5.3).
        requested_by:
          type: string
          description: The name of the person who submitted the change.
        verification:
          $ref: '#/components/schemas/ChangeVerification'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AffectedDocument'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ChangeAttachment'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChangeVerification:
      type: object
      description: Who accepted or rejected the change, when, and why (R-CHG-02).
      required: [verified_by, verified_at, note]
      properties:
        verified_by:
          type: string
          description: The name of the person who verified.
        verified_at:
          type: string
          format: date-time
        note:
          type: string
    ChangeVerificationInput:
      type: object
      required: [decision, note]
      properties:
        decision:
          type: string
          enum: [accept, reject]
        note:
          type: string
          description: Mandatory, at most 2000 characters.
    ChangeAttachment:
      type: object
      required: [id, file_name, content_type, size, sha256, uploaded_by, uploaded_at]
      properties:
        id:
          type: string
        file_name:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
          description: SHA-256 of the content, so anyone can check the file was not changed.
        uploaded_by:
          type: string
        uploaded_at:
          type: string
          format: date-time
    ChangeRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
    AffectedDocument:
      type: object
      required: [id, number, document_type, revision, status]
      properties:
        id:
          type: string
        number:
          type: string
        document_type:
          $ref: '#/components/schemas/ChangeRef'
        revision:
          type: integer
        status:
          type: string
        released_revision:
          type: integer
          description: The revision in force. Missing until the first release.
        draft_revision:
          type: integer
          description: The draft revision this change produced, once the change is accepted (M5.4).
        merged:
          type: boolean
          description: True when the change went into a draft that was already open (R-CHG-03).
    NewChange:
      type: object
      required: [customer_id, trigger_id, change_type_id, reason, document_ids]
      properties:
        customer_id:
          type: string
        trigger_id:
          type: string
        change_type_id:
          type: string
        four_m_category_id:
          type: string
        reason:
          type: string
        source_reference:
          type: string
        document_ids:
          type: array
          items:
            type: string
    ChangeDocumentInput:
      type: object
      required: [document_id]
      properties:
        document_id:
          type: string
    DocumentSection:
      type: object
      required: [id, key, position, name, part_numbers]
      properties:
        id:
          type: string
          description: The section of this document. Rows name this ID.
        key:
          type: string
          description: The same for this section in every document of the set; composition and the check use it.
        position:
          type: integer
        name:
          type: string
          example: Heatsink Assy (R/L)
        part_numbers:
          type: array
          items:
            $ref: '#/components/schemas/DocumentPartNumber'
    NewDocumentSection:
      type: object
      required: [name]
      properties:
        name:
          type: string
        part_number_ids:
          type: array
          items:
            type: string
    DocumentSectionUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        position:
          type: integer
        part_number_ids:
          type: array
          items:
            type: string
    ReferencedDocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReferencedDocument'
    ReferencedDocument:
      type: object
      required: [id, number, title, active, links, created_at]
      properties:
        id:
          type: string
        number:
          type: string
          example: SW-ZZ-103
        title:
          type: string
        level:
          type: string
          description: For example "WI (Level 3)" or "Procedure (Level 2)".
        revision:
          type: string
        revision_date:
          type: string
          format: date
        active:
          type: boolean
        links:
          type: array
          description: By process name, then scope.
          items:
            $ref: '#/components/schemas/ReferencedDocumentLink'
        created_at:
          type: string
          format: date-time
    ReferencedDocumentLink:
      type: object
      required: [id, process, scope]
      properties:
        id:
          type: string
        process:
          $ref: '#/components/schemas/ProcessRef'
        scope:
          $ref: '#/components/schemas/PointScope'
    NewReferencedDocument:
      type: object
      required: [number, title]
      properties:
        number:
          type: string
        title:
          type: string
        level:
          type: string
        revision:
          type: string
        revision_date:
          type: string
          description: YYYY-MM-DD, or empty.
    ReferencedDocumentUpdate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        level:
          type: string
        revision:
          type: string
        revision_date:
          type: string
        active:
          type: boolean
    NewReferencedDocumentLink:
      type: object
      required: [process_id]
      properties:
        process_id:
          type: string
        scope_level:
          type: string
          description: general (when left out), customer, model_group, or model.
        scope_target_id:
          type: string
    DocumentRowBatch:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRowInput'
    DocumentHeader:
      type: object
      required: [header, header_version]
      properties:
        header:
          type: object
          additionalProperties: true
        header_version:
          type: integer
          description: The header_version that was read. A different value on the server gives 409 with code changed (R-DOC-07).
    FormSetList:
      type: object
      required: [items, customer_defaults]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FormSet'
        customer_defaults:
          type: array
          description: Every customer, by code, with its chosen form set.
          items:
            $ref: '#/components/schemas/CustomerFormSet'
    FormSet:
      type: object
      required: [id, key, name, default, versions]
      properties:
        id:
          type: string
        key:
          type: string
          description: Fixed key, for example aiag_4th.
        name:
          type: string
        default:
          type: boolean
          description: The form set of customers that have not chosen one.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/FormSetVersion'
    FormSetVersion:
      type: object
      required: [id, version, status, pfd, pfmea, cp]
      properties:
        id:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, published]
        published_at:
          type: string
          format: date-time
        approvals:
          type: array
          description: Form approvers who approved this version (D-139).
          items:
            $ref: '#/components/schemas/FormApprover'
        pending_approvers:
          type: array
          description: Form approvers still needed before a draft is published, by the approval rule in the system settings.
          items:
            $ref: '#/components/schemas/FormApprover'
        pfd:
          $ref: '#/components/schemas/FormSetSheet'
        pfmea:
          $ref: '#/components/schemas/FormSetSheet'
        cp:
          $ref: '#/components/schemas/FormSetSheet'
    FormApprover:
      type: object
      required: [person_id, person_name]
      properties:
        person_id:
          type: string
        person_name:
          type: string
        approved_at:
          type: string
          format: date-time
          description: Absent for an approver who has not approved yet.
    FormSetSheet:
      type: object
      description: The format template version used for one sheet.
      required: [format_version_id, template_name, version, status]
      properties:
        format_version_id:
          type: string
        template_name:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, published]
    FormSetSheets:
      type: object
      required: [pfd_format_version_id, pfmea_format_version_id, cp_format_version_id]
      properties:
        pfd_format_version_id:
          type: string
        pfmea_format_version_id:
          type: string
        cp_format_version_id:
          type: string
    NewFormSet:
      type: object
      required: [name, pfd_format_version_id, pfmea_format_version_id, cp_format_version_id]
      properties:
        name:
          type: string
        pfd_format_version_id:
          type: string
        pfmea_format_version_id:
          type: string
        cp_format_version_id:
          type: string
    CustomerFormSet:
      type: object
      required: [customer_id, customer_code, customer_name]
      properties:
        customer_id:
          type: string
        customer_code:
          type: string
        customer_name:
          type: string
        form_set_id:
          type: string
          description: Absent when the customer uses the default form set.
    CustomerFormSetChoice:
      type: object
      properties:
        form_set_id:
          type: string
    ApRule:
      type: object
      description: One Action Priority for a box of severity, occurrence, and detection ranges; both ends included.
      required: [s_min, s_max, o_min, o_max, d_min, d_max, priority]
      properties:
        s_min:
          type: integer
        s_max:
          type: integer
        o_min:
          type: integer
        o_max:
          type: integer
        d_min:
          type: integer
        d_max:
          type: integer
        priority:
          type: string
          enum: [H, M, L]
    ApRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApRule'
    ActionPriorityResult:
      type: object
      required: [priority]
      properties:
        priority:
          type: string
          enum: [H, M, L]
    FormatVersion:
      type: object
      required: [id, template_id, version, status, risk_method, highlight_rpn_above, highlight_severity_at_least, fields, ratings, symbols, ap_rules, created_at]
      properties:
        id:
          type: string
        template_id:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, published]
        risk_method:
          type: string
          enum: [rpn, ap, none]
        highlight_rpn_above:
          type: integer
          description: Highlight an RPN above this value; 0 means off.
        highlight_severity_at_least:
          type: integer
          description: Highlight a severity of at least this value; 0 means off.
        fields:
          type: array
          description: Header fields first, then columns, each by position.
          items:
            $ref: '#/components/schemas/FormatField'
        ratings:
          type: array
          description: Severity, occurrence, then detection, values 1 to 10. Empty without a risk method.
          items:
            $ref: '#/components/schemas/RatingCriterion'
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/FormatSymbol'
        ap_rules:
          type: array
          description: The Action Priority table. Empty unless the risk method is AP (D-134).
          items:
            $ref: '#/components/schemas/ApRule'
        approvals:
          type: array
          description: Form approvers who approved this version (D-139).
          items:
            $ref: '#/components/schemas/FormApprover'
        pending_approvers:
          type: array
          description: Form approvers still needed before a draft is published, by the approval rule in the system settings.
          items:
            $ref: '#/components/schemas/FormApprover'
        created_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          description: When the version was published. Absent while it is a draft (M3.4).
    FormatField:
      type: object
      required: [id, area, kind, label, position, required, hidden]
      properties:
        id:
          type: string
          description: Fixed across versions; row content uses this ID.
        area:
          type: string
          enum: [header, row]
        kind:
          type: string
          enum: [text, date, select, symbol, rating, rpn, ap, operation_number, process, process_flow, document_number]
          description: operation_number, process, and process_flow are filled from the row (operation number, process master, PFD steps) and never typed, like rpn (D-122, D-123).
        rating_scale:
          type: string
          enum: [severity, occurrence, detection]
        rating_set:
          type: integer
          description: For rating, rpn, and ap, 1 for the current values and 2 for the action results.
        key:
          type: string
          description: Fixed key of the field, for example failure_mode. Absent for fields without a key.
        group:
          type: string
          description: Title of the column group above this column, for example FAILURE ANALYSIS (STEP 4).
        label:
          type: string
        position:
          type: integer
          description: Position within the area, from 1.
        required:
          type: boolean
        hidden:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/FieldOption'
    FieldOption:
      type: object
      required: [label]
      properties:
        key:
          type: string
          description: Fixed key used by row content. Missing for a new option.
        label:
          type: string
    NewFormatField:
      type: object
      required: [area, kind, label]
      properties:
        area:
          type: string
          enum: [header, row]
        kind:
          type: string
          enum: [text, date, select, symbol, rating, rpn, ap, operation_number, process, process_flow, document_number]
          description: operation_number, process, and process_flow are filled from the row (operation number, process master, PFD steps) and never typed, like rpn (D-122, D-123).
        label:
          type: string
        required:
          type: boolean
        rating_scale:
          type: string
          enum: [severity, occurrence, detection]
        rating_set:
          type: integer
        options:
          type: array
          description: The options of a select field, by label.
          items:
            $ref: '#/components/schemas/FieldOption'
    FormatFieldUpdate:
      type: object
      required: [label]
      properties:
        label:
          type: string
        required:
          type: boolean
        hidden:
          type: boolean
        position:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/FieldOption'
    FormatHighlights:
      type: object
      properties:
        highlight_rpn_above:
          type: integer
        highlight_severity_at_least:
          type: integer
    RatingCriterion:
      type: object
      required: [scale, value, criteria]
      properties:
        scale:
          type: string
          enum: [severity, occurrence, detection]
        value:
          type: integer
        criteria:
          type: string
    RatingCriteriaUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RatingCriterionInput'
    RatingCriterionInput:
      type: object
      required: [scale, value]
      properties:
        scale:
          type: string
          enum: [severity, occurrence, detection]
        value:
          type: integer
        criteria:
          type: string
          description: The new criteria text. An item without criteria changes nothing.
    FormatSymbolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FormatSymbol'
    FormatSymbol:
      type: object
      required: [name]
      properties:
        key:
          type: string
          description: Fixed key used by row content. Missing for a new symbol.
        name:
          type: string
        automatic:
          type: boolean
          readOnly: true
          description: Read only. True for a symbol the system places on changed rows, today Revision (R-REV-09); it prints in the legend but cannot be chosen in a symbol column. Ignored when saving symbols.
    ProcessTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProcessTemplate'
    ProcessRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          description: The current display name of the process (D-06).
    ProcessTemplate:
      type: object
      required: [id, process, versions, created_at]
      properties:
        id:
          type: string
        process:
          $ref: '#/components/schemas/ProcessRef'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ProcessVersionSummary'
        created_at:
          type: string
          format: date-time
    ProcessVersionSummary:
      type: object
      required: [id, version, status]
      properties:
        id:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, published]
        published_at:
          type: string
          format: date-time
          description: When the version was published. Absent while it is a draft (M3.4).
    NewProcessTemplate:
      type: object
      required: [process_id]
      properties:
        process_id:
          type: string
    ProcessTemplateVersion:
      type: object
      required: [id, template_id, process, version, status, subprocesses, created_at]
      properties:
        id:
          type: string
        template_id:
          type: string
        process:
          $ref: '#/components/schemas/ProcessRef'
        version:
          type: integer
        status:
          type: string
          enum: [draft, published]
        subprocesses:
          type: array
          description: In order, hidden ones included.
          items:
            $ref: '#/components/schemas/Subprocess'
        created_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          description: When the version was published. Absent while it is a draft (M3.4).
    Subprocess:
      type: object
      required: [id, name, position, hidden, points]
      properties:
        id:
          type: string
          description: Fixed across versions (working assumption E-33).
        name:
          type: string
        position:
          type: integer
        hidden:
          type: boolean
        points:
          type: array
          description: By document type (PFD, PFMEA, CP), then in order, hidden ones included.
          items:
            $ref: '#/components/schemas/TemplatePoint'
    TemplatePoint:
      type: object
      required: [id, document_type, text, content, position, hidden, scope, variants]
      properties:
        id:
          type: string
          description: Fixed across versions; document rows point to this ID (R-CMP-04).
        content:
          $ref: '#/components/schemas/PointContent'
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        text:
          type: string
        position:
          type: integer
          description: Order within the sub-process for the same document type, from 1.
        hidden:
          type: boolean
        scope:
          $ref: '#/components/schemas/PointScope'
        variants:
          type: array
          description: From the broadest scope to the narrowest, hidden ones included (M3.3).
          items:
            $ref: '#/components/schemas/PointVariant'
    PointContent:
      type: object
      additionalProperties: true
      description: >-
        The content of a point per column of the format, keyed by the fixed field key, for example failure_mode or
        product_characteristic (D-146). A value is text, or a whole number from 1 to 10 for a rating column. One point
        serves every form that has a column with the same key.
    PointScope:
      type: object
      description: What a point or variant is usually used for (M3.3, D-129). Fixed after it is made.
      required: [level]
      properties:
        level:
          type: string
          enum: [general, customer, model_group, model]
        target_id:
          type: string
          description: The customer, model group, or model. Left out for general.
        label:
          type: string
          description: Customer code, model group name, or model name. Left out for general.
    PointVariant:
      type: object
      required: [id, scope, text, content, hidden]
      properties:
        id:
          type: string
          description: Fixed across versions, like a point ID.
        content:
          $ref: '#/components/schemas/PointContent'
        scope:
          $ref: '#/components/schemas/PointScope'
        text:
          type: string
        hidden:
          type: boolean
    NewPointVariant:
      type: object
      required: [scope_level, scope_target_id, text]
      properties:
        scope_level:
          type: string
          description: customer, model_group, or model.
        scope_target_id:
          type: string
        text:
          type: string
        content:
          $ref: '#/components/schemas/PointContent'
    PointVariantUpdate:
      type: object
      required: [text]
      properties:
        text:
          type: string
        content:
          $ref: '#/components/schemas/PointContent'
        hidden:
          type: boolean
    ResolvedPoints:
      type: object
      required: [model, subprocesses]
      properties:
        model:
          $ref: '#/components/schemas/ResolvedModel'
        subprocesses:
          type: array
          description: Visible sub-processes that have at least one point for the model, in order.
          items:
            $ref: '#/components/schemas/ResolvedSubprocess'
    ResolvedModel:
      type: object
      required: [id, name, customer_id, customer_code]
      properties:
        id:
          type: string
        name:
          type: string
        customer_id:
          type: string
        customer_code:
          type: string
        model_group_id:
          type: string
          description: Left out for a model without a group.
        model_group_name:
          type: string
    ResolvedSubprocess:
      type: object
      required: [id, name, points]
      properties:
        id:
          type: string
        name:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedPoint'
    ResolvedPoint:
      type: object
      required: [point_id, origin_id, document_type, text, content, scope]
      properties:
        content:
          $ref: '#/components/schemas/PointContent'
        point_id:
          type: string
          description: The point or the variant that won.
        origin_id:
          type: string
          description: The point the variant belongs to; the same as point_id when no variant won.
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        text:
          type: string
        scope:
          $ref: '#/components/schemas/PointScope'
    NewSubprocess:
      type: object
      required: [name]
      properties:
        name:
          type: string
    SubprocessUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        position:
          type: integer
        hidden:
          type: boolean
    NewTemplatePoint:
      type: object
      required: [subprocess_id, document_type_id, text]
      properties:
        subprocess_id:
          type: string
        document_type_id:
          type: string
        text:
          type: string
        scope_level:
          type: string
          description: general (when left out), customer, model_group, or model (M3.3, D-129).
        content:
          $ref: '#/components/schemas/PointContent'
        scope_target_id:
          type: string
          description: The customer, model group, or model. Left out for general.
    TemplatePointUpdate:
      type: object
      required: [text]
      properties:
        text:
          type: string
        content:
          $ref: '#/components/schemas/PointContent'
        position:
          type: integer
        hidden:
          type: boolean
    SystemSettings:
      type: object
      required: [sign_dates_enabled, form_approval_mode]
      properties:
        sign_dates_enabled:
          type: boolean
          description: When false, signature slots have no sign date and the field is hidden (D-52).
        form_approval_mode:
          type: string
          enum: [all, any]
          description: How many form approvers must approve a form set or an AP table before it is published (D-139). all is the default.
    SystemSettingsUpdate:
      type: object
      properties:
        sign_dates_enabled:
          type: boolean
          description: Leave it out to keep the current value.
        form_approval_mode:
          type: string
          enum: [all, any]
          description: Leave it out to keep the current value.
    CustomerList:
      type: object
      required: [items]
      # Daftar dibungkus objek supaya paginasi cursor (M9.3) nanti bisa
      # ditambahkan tanpa memutus klien (R-API-15).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          # E-20 (D-99): spec lama tidak ada di repo, jadi daftar dari M0.5
          # ini menjadi baseline kode error (brief R-API-13).
          enum:
            - invalid_request
            - validation_failed
            - conflict
            - not_found
            - method_not_allowed
            - unauthenticated
            - invalid_credentials
            - password_change_required
            - forbidden
            - internal_error
        message:
          type: string
          description: Short explanation for people. Never contains technical details.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          description: Same value as the X-Request-Id header.
    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Name of the field in the request body, for example code.
        code:
          type: string
          enum: [required, invalid_format, too_short, too_long, too_common, reserved, taken, incorrect, not_allowed, changed]
        message:
          type: string
