  /api/v1/document-numbers:
    get:
      operationId: listDocumentNumbers
      summary: The number register, newest first, with filters (L-2, UC-12, R-NUM-04)
      description: |
        Give `next_before` from the response as `before` to read the next page.
        `q` matches part of the number text, ignoring case.
      parameters:
        - name: customer_id
          in: query
          schema:
            type: string
        - name: document_type_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [reserved, in_use, released, obsolete, void, skipped]
        - name: q
          in: query
          description: Part of the number text, at most 50 characters.
          schema:
            type: string
        - name: before
          in: query
          description: Return numbers registered before this number ID.
          schema:
            type: string
        - name: limit
          in: query
          description: 1 to 500, default 100.
          schema:
            type: integer
      responses:
        '200':
          description: One page of the register.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentNumberList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: registerDocumentNumber
      summary: Register one PFD, PFMEA, or CP number for a customer (E-1, UC-10, R-NUM-03)
      description: |
        The server takes the next running number of the customer code and
        document type inside one transaction, so parallel registrations never
        collide and leave no gaps. Send a new `Idempotency-Key` for every new
        registration and the same key when retrying it: a repeated request
        returns the original number with status 200 instead of a new number.
        Only active customers get numbers, and the number always carries the
        current customer code (R-POR-01).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDocumentNumber'
      responses:
        '201':
          description: The number was registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberRegistration'
        '200':
          description: The Idempotency-Key was used before for the same request; the original numbers are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberRegistration'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/document-numbers/sets:
    post:
      operationId: registerDocumentNumberSet
      summary: Register PFD, PFMEA, and CP of one model with the same running number (E-1, UC-11, R-NUM-05, M2.4)
      description: |
        The set takes the next running number that is free in all three
        document types. Numbers skipped by a lagging counter are recorded with
        status skipped, so the register has no gaps. The response lists the
        skipped numbers too. Idempotency-Key works as for a single number.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDocumentNumberSet'
      responses:
        '201':
          description: The set was registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberRegistration'
        '200':
          description: The Idempotency-Key was used before for the same request; the original numbers are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberRegistration'
        default:
          $ref: '#/components/responses/Error'
