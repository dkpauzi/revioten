        sections:
          type: array
          description: The sections of the document, one per PCB of the model (D-155), in order. Empty for a document without sections.
          items:
            $ref: '#/components/schemas/DocumentSection'
        set:
          type: array
          description: >-
            The documents of the same set, this one included, by document type (M4.2). Documents from numbers registered
            as a set of PFD, PFMEA, and CP know each other; a single number gives only this document.
          items:
            $ref: '#/components/schemas/DocumentSetMember'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DocumentSetMember:
      type: object
      required: [id, number, document_type]
      properties:
        id:
          type: string
        number:
          type: string
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    DocumentPartNumber:
      type: object
      required: [id, number]
      properties:
        id:
          type: string
        number:
          type: string
        name:
          type: string
    DocumentRow:
      type: object
      required: [id, position, version, operation_manual, detached, content]
      properties:
        id:
          type: string
          description: Fixed for the life of the row (R-DOC-02).
        position:
          type: integer
        version:
          type: integer
          description: Goes up by one each time the row is saved. Send it back when changing the row (R-DOC-07).
        process_id:
          type: string
        process_name:
          type: string
        operation_number:
          type: string
        operation_manual:
          type: boolean
          description: The operation number was typed or pasted, so automatic numbering keeps it (M4.6).
        detached:
          type: boolean
          description: The link to the template point was cut, with a reason (M4.8).
        section_id:
          type: string
          description: The section of the row (D-155); left out for a document without sections.
        detach_reason:
          type: string
        content:
          type: object
          additionalProperties: true
          description: Row content keyed by column field ID.
        template_point_id:
          type: string
          description: The process template point this row was composed from; left out for a typed or pasted row (R-CMP-04).
    DocumentRowInput:
      type: object
      required: [content]
      properties:
        process_id:
          type: string
        operation_number:
          type: string
        content:
          type: object
          additionalProperties: true
        section_id:
          type: string
          description: The section of a new row; required when the document has sections (D-155). Ignored when changing a row.
        version:
          type: integer
          description: >-
            The version of the row that was read. Required when changing a row, ignored when adding one. When the row
            was changed by someone else in the meantime the answer is 409 with code changed, and nothing is saved
            (optimistic locking, R-DOC-07).
    Composition:
      type: object
      required: [process_template_version_id, version, process, subprocesses]
      properties:
        process_template_version_id:
          type: string
        version:
          type: integer
        process:
          $ref: '#/components/schemas/NamedRef'
        subprocesses:
          type: array
          items:
            $ref: '#/components/schemas/ComposedSubprocess'
    ComposedSubprocess:
      type: object
      required: [id, name, points]
      properties:
        id:
          type: string
        name:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/ComposedPoint'
    ComposedPoint:
      type: object
      required: [point_id, document_type, text, document_id, state]
      properties:
        point_id:
          type: string
          description: The origin point; rows are linked to this ID.
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        text:
          type: string
          description: The text of the point, or of the variant that applies to the model.
        document_id:
          type: string
          description: The document of the set that receives this point.
        state:
          type: string
          enum: [included, excluded, undecided]
        reason:
          type: string
          description: Why the point is excluded, when a reason was given.
    ComposeInput:
      type: object
      required: [process_template_version_id]
      properties:
        process_template_version_id:
          type: string
        section_key:
          type: string
          description: The section to compose (D-155); required when the set has sections.
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            $ref: '#/components/schemas/PointExclusion'
    PointExclusion:
      type: object
      required: [point_id]
      properties:
        point_id:
          type: string
        reason:
          type: string
    PfmeaCpComparison:
      type: object
      required: [pfmea, cp, processes]
      properties:
        pfmea:
          $ref: '#/components/schemas/Document'
        cp:
          $ref: '#/components/schemas/Document'
        processes:
          type: array
          items:
            $ref: '#/components/schemas/PfmeaCpProcess'
    PfmeaCpProcess:
      type: object
      required: [pfmea_row_ids, cp_row_ids]
      properties:
        section_key:
          type: string
          description: The section (D-155); left out for a set without sections.
        section_name:
          type: string
        process_id:
          type: string
          description: Left out for the rows that have no process.
        process_name:
          type: string
        pfmea_row_ids:
          type: array
          items:
            type: string
        cp_row_ids:
          type: array
          items:
            type: string
        check:
          $ref: '#/components/schemas/PfmeaCpCheck'
    PfmeaCpCheck:
      type: object
      required: [checked_by, checked_at, pfmea_revision, cp_revision, stale]
      properties:
        checked_by:
          type: string
          description: The name of the person who set the mark.
        checked_at:
          type: string
          format: date-time
        pfmea_revision:
          type: integer
        cp_revision:
          type: integer
        stale:
          type: boolean
          description: A row of this process changed after the mark was set, so it should be checked again.
    PfmeaCpCheckInput:
      type: object
      required: [process_id, checked]
      properties:
        section_key:
          type: string
          description: The section (D-155); required when the set has sections.
        process_id:
          type: string
        checked:
          type: boolean
    RowDifferenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RowDifference'
    RowDifference:
      type: object
      required: [row_id, position, point_id, point_text, status, fields]
      properties:
        row_id:
          type: string
        position:
          type: integer
        point_id:
          type: string
        point_text:
          type: string
          description: The text of the point, or of the variant that applies to the model.
        status:
          type: string
          enum: [same, different, detached]
        reason:
          type: string
          description: Why the row was detached.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDifference'
    FieldDifference:
      type: object
      required: [label, template, row]
      properties:
        field_id:
          type: string
          description: The column; left out for the process of the row.
        label:
          type: string
        template:
          description: What the template point writes into this column; an empty string when it writes nothing.
        row:
          description: What the row holds now; an empty string when the cell is empty.
    RowDetach:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    DocumentCopy:
      type: object
      required: [source_document_id]
      properties:
        source_document_id:
          type: string
    DocumentOrder:
      type: object
      required: [row_ids]
      properties:
        section_id:
          type: string
          description: The section to order (D-155); required when the document has sections. Operation numbers start again at 10 per section.
        row_ids:
          type: array
          items:
            type: string
        renumber:
          type: boolean
          description: Number the operations automatically after ordering. Default false.
    ChangeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Change'
    Change:
      type: object
      required: [id, ref, customer_id, customer_code, mechanism, change_type, reason, status, requested_by, documents, attachments, impacts, created_at, updated_at]
      properties:
        id:
          type: string
        ref:
          type: string
          description: The reference number of the change, for example CHG-0001.
        customer_id:
          type: string
        customer_code:
          type: string
        mechanism:
          type: string
          enum: [manual, yokoten, template, sqam]
          description: How the change started (D-113). Manual changes are submitted on screen.
        trigger:
          $ref: '#/components/schemas/ChangeRef'
        change_type:
          $ref: '#/components/schemas/ChangeRef'
        four_m:
          $ref: '#/components/schemas/ChangeRef'
        reason:
          type: string
        source_reference:
          type: string
          description: For example a complaint number, an 8D number, an audit finding, or an SQAM revision.
        status:
          type: string
          enum: [submitted, accepted, rejected]
          description: Submitted, then accepted or rejected by a verifier (M5.3).
        requested_by:
          type: string
          description: The name of the person who submitted the change.
        verification:
          $ref: '#/components/schemas/ChangeVerification'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AffectedDocument'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ChangeAttachment'
        template:
          $ref: '#/components/schemas/ChangeTemplate'
        source_change:
          $ref: '#/components/schemas/ChangeRef'
        effective_date:
          type: string
          format: date
          description: When the SQAM revision or the propagation with scope all takes effect.
        impacts:
          type: array
          description: The impact checklist (R-CHG-05, M5.7).
          items:
            $ref: '#/components/schemas/ChangeImpact'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SQAMChangeInput:
      type: object
      required: [customer_id, change_type_id, reason, sqam_reference]
      properties:
        customer_id:
          type: string
        change_type_id:
          type: string
        four_m_category_id:
          type: string
        reason:
          type: string
        sqam_reference:
          type: string
          description: The SQAM revision, for example SQAM-KT rev 7, at most 200 characters.
        document_type_ids:
          type: array
          description: The document types the SQAM revision affects (D-171); empty or missing means every type.
          items:
            type: string
        effective_date:
          type: string
          format: date
          description: Required; checked by the server so a missing date gets a clear message.
    YokotenTargetFilter:
      type: object
      description: One of customer_id, model_group_id (D-40), or model_ids; process_id and text narrow the documents.
      properties:
        customer_id:
          type: string
        model_group_id:
          type: string
        model_ids:
          type: array
          items:
            type: string
        process_id:
          type: string
        text:
          type: string
          description: Searched in the row content of the documents, at most 200 characters.
    YokotenSearch:
      type: object
      required: [source_change_id, targets]
      properties:
        source_change_id:
          type: string
        targets:
          $ref: '#/components/schemas/YokotenTargetFilter'
    NewYokoten:
      type: object
      required: [source_change_id, reason, targets]
      properties:
        source_change_id:
          type: string
        reason:
          type: string
        targets:
          $ref: '#/components/schemas/YokotenTargetFilter'
    Yokoten:
      type: object
      required: [id, ref, source_change, reason, created_by, created_at, targets]
      properties:
        id:
          type: string
        ref:
          type: string
          description: For example YKT-0001.
        source_change:
          $ref: '#/components/schemas/ChangeRef'
        reason:
          type: string
        process_filter:
          type: string
        text_filter:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        targets:
          type: array
          items:
            $ref: '#/components/schemas/YokotenTarget'
    YokotenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Yokoten'
    YokotenTargetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/YokotenTarget'
    YokotenTarget:
      type: object
      required: [model_id, model_name, customer_id, customer_code, decision, progress, documents]
      properties:
        id:
          type: string
          description: Missing in a search, before the yokoten is saved.
        model_id:
          type: string
        model_name:
          type: string
        customer_id:
          type: string
        customer_code:
          type: string
        decision:
          type: string
          enum: [pending, apply, adapt, not_applicable]
        reason:
          type: string
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
        change:
          $ref: '#/components/schemas/ChangeRef'
        progress:
          type: string
          enum: [undecided, not_applicable, waiting_verification, rejected, in_draft, released]
        documents:
          type: array
          items:
            $ref: '#/components/schemas/YokotenDocument'
    YokotenDocument:
      type: object
      required: [id, number, document_type, revision, status]
      properties:
        id:
          type: string
        number:
          type: string
        document_type:
          type: string
        revision:
          type: integer
        status:
          type: string
        released_revision:
          type: integer
    YokotenDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          description: apply, adapt, or not_applicable.
        reason:
          type: string
          description: Required for not_applicable.
    ChangeTemplate:
      type: object
      description: The template propagation behind a change with mechanism template (M5.8).
      required: [version_id, scope, conflict_policy]
      properties:
        version_id:
          type: string
        scope:
          type: string
          enum: [following, all]
        conflict_policy:
          type: string
          enum: [keep, overwrite]
        effective_date:
          type: string
          format: date
    PropagationInput:
      type: object
      required: [scope, conflict_policy, change_type_id, reason]
      properties:
        scope:
          type: string
          description: following (documents that follow, the default) or all (also pinned documents).
        conflict_policy:
          type: string
          description: keep (rows changed locally stay and are counted) or overwrite.
        change_type_id:
          type: string
        reason:
          type: string
        source_reference:
          type: string
          description: The SQAM revision; required for scope all.
        effective_date:
          type: string
          format: date
          description: Required for scope all.
    PropagationPreview:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropagationItem'
    PropagationItem:
      type: object
      required: [document_id, number, customer_id, status, mode, included, updates, conflicts, removed, rows]
      properties:
        document_id:
          type: string
        number:
          type: string
        customer_id:
          type: string
        status:
          type: string
          description: Draft or released.
        mode:
          type: string
          enum: [follow, pinned, detached]
        included:
          type: boolean
        skipped:
          type: string
          enum: [pinned, detached, no_change, already_proposed]
        updates:
          type: integer
        conflicts:
          type: integer
        removed:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PropagationRow'
    PropagationRow:
      type: object
      required: [row_id, position, status, point_text, fields]
      properties:
        row_id:
          type: string
        position:
          type: integer
        status:
          type: string
          enum: [update, conflict, removed]
        point_text:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDifference'
    DocumentTemplate:
      type: object
      required: [process_template_id, process_name, version, mode]
      properties:
        process_template_id:
          type: string
        process_name:
          type: string
        version:
          type: integer
          description: The newest template version the rows of the document use.
        mode:
          type: string
          enum: [follow, pinned, detached]
        reason:
          type: string
    DocumentTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTemplate'
    DocumentTemplateModeInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
        reason:
          type: string
          description: Required for pinned and detached.
    ChangeImpact:
      type: object
      required: [id, kind, decision, updated_by, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [pfd, pfmea, cp, wi, inspection_standard, other]
        document_reference:
          type: string
          description: The number or name of the related document, for example SW-ZZ-116.
        referenced_document_id:
          type: string
          description: The document in the master list of referenced documents, when picked from it (D-168).
        decision:
          type: string
          enum: [affected, not_affected]
        reason:
          type: string
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time
    ChangeImpactInput:
      type: object
      required: [kind, decision]
      properties:
        kind:
          type: string
        referenced_document_id:
          type: string
          description: Pick from the master list of referenced documents (D-168); the number and title are copied from it.
        document_reference:
          type: string
        decision:
          type: string
        reason:
          type: string
          description: Required when the document is not affected.
    ChangeImpactsInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeImpactInput'
    ChangeVerification:
      type: object
      description: Who accepted or rejected the change, when, and why (R-CHG-02).
      required: [verified_by, verified_at, note]
      properties:
        verified_by:
          type: string
          description: The name of the person who verified.
        verified_at:
          type: string
          format: date-time
        note:
          type: string
    ChangeVerificationInput:
      type: object
      required: [decision, note]
      properties:
        decision:
          type: string
          enum: [accept, reject]
        note:
          type: string
          description: Mandatory, at most 2000 characters.
    ChangeAttachment:
      type: object
      required: [id, file_name, content_type, size, sha256, uploaded_by, uploaded_at]
      properties:
        id:
          type: string
        file_name:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
          description: SHA-256 of the content, so anyone can check the file was not changed.
        uploaded_by:
          type: string
        uploaded_at:
          type: string
          format: date-time
    ChangeRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
    DocumentRevision:
      type: object
      required: [id, revision, status, created_by, created_at, changes]
      properties:
        id:
          type: string
        revision:
          type: integer
        status:
          type: string
          enum: [draft, released]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        released_by:
          type: string
          description: The person who recorded the release.
        released_at:
          type: string
          format: date-time
        sha256:
          type: string
          description: SHA-256 of the frozen snapshot (snapshot_hash, R-REV-07).
        release_date:
          type: string
          format: date
          description: Filled when the revision is printed for signature (D-59).
        scan_file_name:
          type: string
          description: The signed scan uploaded for this revision (M6.7).
        migrated:
          type: boolean
          description: True when the revision was released by verification against the hard copy (M7.5).
        ready_at:
          type: string
          format: date-time
          description: When the draft was marked ready to print (D-202).
        changes:
          type: array
          description: Reference numbers of the changes that went into this revision (M5.6).
          items:
            type: string
    DocumentDiff:
      type: object
      description: The changes between two revisions, row by row and cell by cell (R-REV-03).
      required: [from, to_draft, header, rows]
      properties:
        from:
          type: integer
        to:
          type: integer
          description: Missing when the comparison is with the open draft.
        to_draft:
          type: boolean
        process_id:
          type: string
        header:
          type: array
          items:
            $ref: '#/components/schemas/DocumentCellChange'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRowChange'
    DocumentRowChange:
      type: object
      required: [row_id, status, cells]
      properties:
        row_id:
          type: string
        status:
          type: string
          enum: [added, removed, changed, moved]
        old_position:
          type: integer
        new_position:
          type: integer
        process_id:
          type: string
        process_name:
          type: string
        operation_number:
          type: string
        cells:
          type: array
          items:
            $ref: '#/components/schemas/DocumentCellChange'
    DocumentCellChange:
      type: object
      required: [field_id, label]
      properties:
        field_id:
          type: string
        label:
          type: string
        old:
          description: The value before; missing when the cell was empty.
        new:
          description: The value after; missing when the cell is empty.
    PrintRequest:
      type: object
      required: [purpose, format]
      properties:
        purpose:
          type: string
          description: draft, signature, reference, or controlled (R-PRT-04).
        format:
          type: string
          description: xlsx or pdf.
        revision:
          type: integer
          description: Leave out for the open draft, or the revision in force when there is no draft.
    PrintLog:
      type: object
      required: [id, revision, purpose, format, sha256, printed_by, printed_at]
      properties:
        id:
          type: string
        revision:
          type: integer
        purpose:
          type: string
          enum: [draft, signature, reference, controlled]
        format:
          type: string
          enum: [xlsx, pdf]
        copy_number:
          type: integer
        sha256:
          type: string
          description: SHA-256 of the printed content.
        printed_by:
          type: string
        printed_at:
          type: string
          format: date-time
    PrintLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrintLog'
    SignedScan:
      type: object
      required: [revision, file_name, content_type, size, sha256, uploaded_by, uploaded_at]
      properties:
        revision:
          type: integer
        file_name:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        uploaded_by:
          type: string
        uploaded_at:
          type: string
          format: date-time
    RevisionVerification:
      type: object
      required: [revision_id, document_id, number, document_type, customer_code, revision, status]
      properties:
        revision_id:
          type: string
        document_id:
          type: string
        number:
          type: string
        document_type:
          type: string
        customer_code:
          type: string
        revision:
          type: integer
        status:
          type: string
          enum: [effective, superseded, draft, void, obsolete]
        released_at:
          type: string
          format: date-time
        sha256:
          type: string
    PrintLayoutContent:
      type: object
      description: The layout as data (R-PRT-02). Widths are relative, per field key or field ID.
      required: [paper, orientation, font_size, margins_mm, cover, revision_marks, widths]
      properties:
        paper:
          type: string
          enum: [A3, A4]
        orientation:
          type: string
          enum: [landscape, portrait]
        font_size:
          type: number
        margins_mm:
          type: object
          required: [top, right, bottom, left]
          properties:
            top:
              type: number
            right:
              type: number
            bottom:
              type: number
            left:
