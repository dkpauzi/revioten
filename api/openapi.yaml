    post:
      operationId: printDocument
      summary: Print a document as Excel or PDF and record the print (M6.2 to M6.6, R-PRT-01, R-PRT-04)
      description: >-
        A draft prints as draft (L-4) or for signature (E-5, fills the release date, D-59). A released revision
        prints as reference (L-3) or as a numbered controlled copy (E-9). Drafts carry UNCONTROLLED COPY.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintRequest'
      responses:
        '200':
          description: The printed file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
