# Kontrak API untuk layar web (R-API-02, D-38). Ditulis lebih dulu, lalu kode
# server Go (oapi-codegen) dan tipe TypeScript (@hey-api/openapi-ts) dibuat
# dari file ini. Jangan mengubah kode hasil generate; ubah file ini lalu jalankan
# ulang generator (lihat CLAUDE.md, bagian perintah).
#
# Teks description berbahasa Inggris karena dibaca pemakai API, sama seperti
# teks layar (Q-14). Komentar dengan tanda # tetap berbahasa Indonesia.
openapi: 3.0.4
info:
  title: Revioten web API
  version: 0.1.0
  description: |
    API used by the web screens of the PFD, PFMEA, and CP system.

    Conventions (R-API-13):
    - JSON over HTTP. Times are UTC in ISO 8601.
    - IDs are opaque and stable. Clients must not parse them.
    - Every response carries an `X-Request-Id` header. A client may send its
      own `X-Request-Id` (1 to 64 characters: letters, digits, `.`, `_`, `-`);
      otherwise the server creates one.
    - Every error uses the `Error` schema, with the same request ID as the
      header. Technical details are written only to the server log.
    - Every operation needs a session (cookie `__Host-revioten_session`,
      set by `POST /api/v1/session`), except where `security` is empty.
      Without a valid session the answer is 401 `unauthenticated`.
    - Requests that change data from another site are refused with 403
      `forbidden` (checked with the Sec-Fetch-Site and Origin headers).
    - Every operation checks the rights of the caller (M1.2). Without the
      right, the answer is 403 `forbidden`. The rights of the caller are
      listed in `Session.permissions`, with codes from the user map (U3).
# Semua operasi butuh sesi login (M1.1, UC-01), kecuali yang menulis security: [].
security:
  - sessionCookie: []
paths:
  # E-17 (diputuskan): /health ada di root, di luar /api/v1.
  /health:
    get:
      operationId: getHealth
      summary: Server and database status
      # E-08 (D-85): /health terbuka tanpa login, karena dipakai untuk memantau
      # server dan tidak berisi data.
      security: []
      responses:
        '200':
          description: The server and the database are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The server runs, but the database is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/session:
    get:
      operationId: getSession
      summary: The session of the caller
      responses:
        '200':
          description: The caller is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: login
      summary: Log in with a login name and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Logged in. The response sets the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: logout
      summary: Log out and end the session
      responses:
        '204':
          description: Logged out. The response removes the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/account/password:
    put:
      operationId: changePassword
      summary: Change the password of the caller
      description: |
        Needs the current password. All sessions of the account end, and the
        response sets a new session cookie for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: The password was changed. The response sets a new session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: The role catalog with the rights of each role (A-1)
      responses:
        '200':
          description: All roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: All accounts with their person and roles (A-1)
      responses:
        '200':
          description: All accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAccount
      summary: Create an account with a temporary password (A-1)
      description: |
        The temporary password is returned only in this response. The owner
        must change it at the first login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccount'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts/{accountId}/roles:
    put:
      operationId: setAccountRoles
      summary: Replace the roles of a work account (A-1)
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolesUpdate'
      responses:
        '200':
          description: The roles were replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts/{accountId}/password-reset:
    post:
      operationId: resetAccountPassword
      summary: Set a new temporary password for another account (A-1)
      description: |
        All sessions of the account end, the account is unlocked, and the
        owner must change the password at the next login.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The new temporary password, shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPassword'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts/{accountId}/disable:
    post:
      operationId: disableAccount
      summary: Disable another account and end its sessions (A-1)
      description: The last active admin account cannot be disabled (D-73).
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/accounts/{accountId}/enable:
    post:
      operationId: enableAccount
      summary: Enable an account again and unlock it (A-1)
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: List all customers, ordered by code
      responses:
        '200':
          description: All customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCustomer
      summary: Add a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCustomer'
      responses:
        '201':
          description: The customer was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/customers/{customerId}:
    put:
      operationId: updateCustomer
      summary: Change the name, project group, and status of a customer (A-2)
      description: |
        Customers are never deleted; set `active` to false instead (E-09).
        The code is changed with POST /api/v1/customers/{customerId}/code.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: The customer was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/customers/{customerId}/code:
    post:
      operationId: changeCustomerCode
      summary: Give a customer a new code; the old code stays in its history (A-2, E-11)
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCodeChange'
      responses:
        '200':
          description: The code was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/project-groups:
    get:
      operationId: listProjectGroups
      summary: All project groups, ordered by code
      responses:
        '200':
          description: All project groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroupList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProjectGroup
      summary: Add a project group (A-2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupInput'
      responses:
        '201':
          description: The project group was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroup'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/project-groups/{projectGroupId}:
    put:
      operationId: updateProjectGroup
      summary: Change the code and name of a project group (A-2)
      parameters:
        - $ref: '#/components/parameters/ProjectGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupInput'
      responses:
        '200':
          description: The project group was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroup'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/model-groups:
    get:
      operationId: listModelGroups
      summary: The model groups of one customer, ordered by name
      parameters:
        - $ref: '#/components/parameters/CustomerIdQuery'
      responses:
        '200':
          description: The model groups of the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroupList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createModelGroup
      summary: Add a model group to a customer (A-2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewModelGroup'
      responses:
        '201':
          description: The model group was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroup'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/model-groups/{modelGroupId}:
    put:
      operationId: updateModelGroup
      summary: Rename a model group (A-2)
      parameters:
        - $ref: '#/components/parameters/ModelGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelGroupUpdate'
      responses:
        '200':
          description: The model group was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroup'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/models:
    get:
      operationId: listModels
      summary: The models of one customer, ordered by name
      parameters:
        - $ref: '#/components/parameters/CustomerIdQuery'
      responses:
        '200':
          description: The models of the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createModel
      summary: Add a model to a customer, in at most one model group (A-2, D-42)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewModel'
      responses:
        '201':
          description: The model was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/models/{modelId}:
    put:
      operationId: updateModel
      summary: Rename a model or move it to another model group of the same customer (A-2)
      parameters:
        - $ref: '#/components/parameters/ModelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdate'
      responses:
        '200':
          description: The model was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/part-numbers:
    get:
      operationId: listPartNumbers
      summary: The part numbers of one customer, ordered by model and number
      parameters:
        - $ref: '#/components/parameters/CustomerIdQuery'
      responses:
        '200':
          description: The part numbers of the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartNumberList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createPartNumber
      summary: Add a part number to a model (A-2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPartNumber'
      responses:
        '201':
          description: The part number was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartNumber'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/part-numbers/{partNumberId}:
    put:
      operationId: updatePartNumber
      summary: Change the number and name of a part number (A-2)
      parameters:
        - $ref: '#/components/parameters/PartNumberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartNumberUpdate'
      responses:
        '200':
          description: The part number was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartNumber'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/processes:
    get:
      operationId: listProcesses
      summary: All processes with their aliases, ordered by name (UC-04)
      responses:
        '200':
          description: The process master.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProcess
      summary: Add a process with a fixed ID, a display name, and aliases (E-6, D-06, D-64)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProcess'
      responses:
        '201':
          description: The process was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/processes/{processId}:
    get:
      operationId: getProcess
      summary: One process by its fixed ID, with the name in use today (D-06)
      parameters:
        - $ref: '#/components/parameters/ProcessId'
      responses:
        '200':
          description: The process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateProcess
      summary: Rename a process or replace its aliases. The ID stays, so references keep working (E-6, D-06)
      parameters:
        - $ref: '#/components/parameters/ProcessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessUpdate'
      responses:
        '200':
          description: The process was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/number-settings:
    get:
      operationId: getNumberSettings
      summary: Number settings - factory code, number pattern, running number format, and revision digits (D-89)
      responses:
        '200':
          description: The number settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateNumberSettings
      summary: Change the number settings. Issued numbers keep their text (A-2, R-NUM-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberSettingsUpdate'
      responses:
        '200':
          description: The number settings were changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSettings'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/document-numbers:
    post:
      operationId: registerDocumentNumber
      summary: Register one PFD, PFMEA, or CP number for a customer (E-1, UC-10, R-NUM-03)
      description: |
        The server takes the next running number of the customer code and
        document type inside one transaction, so parallel registrations never
        collide and leave no gaps. Send a new `Idempotency-Key` for every new
        registration and the same key when retrying it: a repeated request
        returns the original number with status 200 instead of a new number.
        Only active customers get numbers, and the number always carries the
        current customer code (R-POR-01).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDocumentNumber'
      responses:
        '201':
          description: The number was registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberRegistration'
        '200':
          description: The Idempotency-Key was used before for the same request; the original numbers are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberRegistration'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/document-numbers/next:
    get:
      operationId: getNextDocumentNumber
      summary: The number the next registration would get, without registering it (L-2)
      parameters:
        - $ref: '#/components/parameters/CustomerIdQuery'
        - $ref: '#/components/parameters/DocumentTypeIdQuery'
      responses:
        '200':
          description: The next number. Someone else may still register it first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextDocumentNumber'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/document-types:
    get:
      operationId: listDocumentTypes
      summary: Document types with their number prefix (R-NUM-01, E-12)
      responses:
        '200':
          description: The document types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createDocumentType
      summary: Add another document type from the WI, for example Work Instruction (A-2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentTypeInput'
      responses:
        '201':
          description: The document type was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentType'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/document-types/{documentTypeId}:
    put:
      operationId: updateDocumentType
      summary: Change the name and letter of a document type (A-2)
      parameters:
        - $ref: '#/components/parameters/DocumentTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentTypeInput'
      responses:
        '200':
          description: The document type was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentType'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/special-codes:
    get:
      operationId: listSpecialCodes
      summary: Special codes used in place of a customer code, ordered by code (E-12)
      responses:
        '200':
          description: The special codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialCodeList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createSpecialCode
      summary: Add a special code. It cannot equal any customer code, now or before (A-2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSpecialCode'
      responses:
        '201':
          description: The special code was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialCode'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/special-codes/{specialCodeId}:
    put:
      operationId: updateSpecialCode
      summary: Rename a special code. The code itself never changes (A-2)
      parameters:
        - $ref: '#/components/parameters/SpecialCodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameUpdate'
      responses:
        '200':
          description: The special code was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialCode'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-types:
    get:
      operationId: listChangeTypes
      summary: The change types content, layout only, and administrative (R-TPL-10)
      responses:
        '200':
          description: The change types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeTypeList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-types/{changeTypeId}:
    put:
      operationId: updateChangeType
      summary: Rename a change type (A-2)
      parameters:
        - $ref: '#/components/parameters/ChangeTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameUpdate'
      responses:
        '200':
          description: The change type was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeType'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-sources:
    get:
      operationId: listChangeSources
      summary: Change sources, active and inactive, ordered by name (R-CHG-06)
      responses:
        '200':
          description: The change sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSourceList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChangeSource
      summary: Add a change source (A-2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameUpdate'
      responses:
        '201':
          description: The change source was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSource'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-sources/{changeSourceId}:
    put:
      operationId: updateChangeSource
      summary: Rename a change source, or switch it off or on (A-2)
      parameters:
        - $ref: '#/components/parameters/ChangeSourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSourceUpdate'
      responses:
        '200':
          description: The change source was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSource'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/four-m-categories:
    get:
      operationId: listFourMCategories
      summary: The 4M categories Man, Machine, Material, and Method
      responses:
        '200':
          description: The 4M categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FourMCategoryList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/four-m-categories/{fourMCategoryId}:
    put:
      operationId: updateFourMCategory
      summary: Rename a 4M category (A-2)
      parameters:
        - $ref: '#/components/parameters/FourMCategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameUpdate'
      responses:
        '200':
          description: The 4M category was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FourMCategory'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/positions:
    get:
      operationId: listPositions
      summary: Positions of the NPI organization chart with their holders (D-54, D-58)
      responses:
        '200':
          description: The positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/positions/{positionId}:
    put:
      operationId: updatePosition
      summary: Rename a position. Its key and holders stay (A-1, D-58)
      parameters:
        - $ref: '#/components/parameters/PositionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameUpdate'
      responses:
        '200':
          description: The position was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/positions/{positionId}/holders:
    post:
      operationId: addPositionHolder
      summary: Record a person as holder of a position (A-1). One Project Leader and one Project Engineer per project group (D-54)
      parameters:
        - $ref: '#/components/parameters/PositionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPositionHolder'
      responses:
        '201':
          description: The holder was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionHolder'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/positions/{positionId}/holders/{holderId}:
    delete:
      operationId: removePositionHolder
      summary: Remove a holder from a position (A-1)
      parameters:
        - $ref: '#/components/parameters/PositionId'
        - $ref: '#/components/parameters/HolderId'
      responses:
        '204':
          description: The holder was removed.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/approval-routes:
    get:
      operationId: listApprovalRoutes
      summary: Approval routes with their slots in signing order, ordered by name (R-APR-08)
      responses:
        '200':
          description: The approval routes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRouteList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createApprovalRoute
      summary: Add an approval route (A-2, UC-06)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRouteInput'
      responses:
        '201':
          description: The approval route was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRoute'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/approval-routes/{approvalRouteId}:
    put:
      operationId: updateApprovalRoute
      summary: Rename an approval route and replace its slots (A-2, R-APR-15)
      parameters:
        - $ref: '#/components/parameters/ApprovalRouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRouteInput'
      responses:
        '200':
          description: The approval route was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRoute'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/customers/{customerId}/default-route:
    put:
      operationId: setCustomerDefaultRoute
      summary: Set the default approval route of a customer (A-2, D-47)
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteChoice'
      responses:
        '200':
          description: The default route was set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-types/{changeTypeId}/approval-route:
    put:
      operationId: setChangeTypeRoute
      summary: Set the approval route of a change type, or use the customer default (A-2, R-TPL-10)
      parameters:
        - $ref: '#/components/parameters/ChangeTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTypeRouteChoice'
      responses:
        '200':
          description: The route of the change type was set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeType'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/system-settings:
    get:
      operationId: getSystemSettings
      summary: System settings, today the sign date switch (D-52)
      responses:
        '200':
          description: The system settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSystemSettings
      summary: Change the system settings (A-3, UC-07)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsUpdate'
      responses:
        '200':
          description: The system settings were changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/audit-log:
    get:
      operationId: listAuditLog
      summary: Audit log entries, newest first (A-4, admin account only)
      description: |
        Every change of data writes one entry (R-SEC-03). The entries form one
        hash chain: the hash of each entry covers its content and the hash of
        the entry before it. Give `next_before` from the response as `before`
        to read older entries.
      parameters:
        - name: before
          in: query
          description: Return entries with a lower number than this. Leave it out for the newest entries.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          description: Number of entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Audit log entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/audit-log/verification:
    get:
      operationId: verifyAuditLog
      summary: Check the whole hash chain of the audit log (A-4, admin account only)
      responses:
        '200':
          description: The result of the check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    CustomerIdQuery:
      name: customer_id
      in: query
      required: true
      description: The customer whose master data is listed.
      schema:
        type: string
    DocumentTypeIdQuery:
      name: document_type_id
      in: query
      required: true
      description: The document type, PFD, PFMEA, or CP.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Required by the server (422 idempotency_key:required when missing).
        1 to 100 characters - letters, digits, `.`, `:`, `_`, `-` - for example a UUID.
        It is kept per account.
      schema:
        type: string
    ProjectGroupId:
      name: projectGroupId
      in: path
      required: true
      schema:
        type: string
    ModelGroupId:
      name: modelGroupId
      in: path
      required: true
      schema:
        type: string
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
    PartNumberId:
      name: partNumberId
      in: path
      required: true
      schema:
        type: string
    ProcessId:
      name: processId
      in: path
      required: true
      schema:
        type: string
    DocumentTypeId:
      name: documentTypeId
      in: path
      required: true
      schema:
        type: string
    SpecialCodeId:
      name: specialCodeId
      in: path
      required: true
      schema:
        type: string
    ChangeTypeId:
      name: changeTypeId
      in: path
      required: true
      schema:
        type: string
    ChangeSourceId:
      name: changeSourceId
      in: path
      required: true
      schema:
        type: string
    FourMCategoryId:
      name: fourMCategoryId
      in: path
      required: true
      schema:
        type: string
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
    HolderId:
      name: holderId
      in: path
      required: true
      schema:
        type: string
    ApprovalRouteId:
      name: approvalRouteId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-revioten_session
  responses:
    Error:
      description: |
        The request failed. `code` says why: `invalid_request` (400, the body
        cannot be read as JSON), `validation_failed` (422, see `details`),
        `conflict` (409, for example the code is already used), `not_found`
        (404), `method_not_allowed` (405), `unauthenticated` (401, no valid
        session), `invalid_credentials` (401, login failed),
        `password_change_required` (403, change the password first),
        `forbidden` (403, the caller lacks the right or the request came
        from another site), or `internal_error` (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unreachable]
    Customer:
      type: object
      required: [id, code, name, active, codes, created_at]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        code:
          type: string
          description: Current customer code used in document numbers, for example SC-AB-001.
          pattern: '^[A-Z]{2}$'
          example: AB
        name:
          type: string
          example: Example Customer
        default_route:
          $ref: '#/components/schemas/ApprovalRouteRef'
        project_group:
          $ref: '#/components/schemas/ProjectGroupRef'
        active:
          type: boolean
          description: Customers are never deleted; inactive customers get no new models (E-09).
        codes:
          type: array
          description: All codes of the customer, oldest first. The last one is the current code (E-11).
          items:
            $ref: '#/components/schemas/CustomerCode'
        created_at:
          type: string
          format: date-time
    CustomerCode:
      type: object
      required: [code, valid_from]
      properties:
        code:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          description: Missing for the current code.
    ProjectGroupRef:
      type: object
      required: [id, code]
      description: |
        The project group of the customer (D-54). Missing only for customers
        added before project groups existed.
      properties:
        id:
          type: string
        code:
          type: string
    Credentials:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: admin.example
        password:
          type: string
          format: password
    Session:
      type: object
      required: [account, person, must_change_password, permissions]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        person:
          $ref: '#/components/schemas/Person'
        must_change_password:
          type: boolean
          description: |
            True after an admin reset the password. Until the password is
            changed, other operations answer 403 `password_change_required`.
        permissions:
          type: array
          description: |
            The rights of the caller, as codes from the user map (U3), for
            example L-1 or A-2. Screens use them to show or hide actions; the
            server still checks every operation.
          items:
            type: string
    Account:
      type: object
      required: [id, login, kind]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        login:
          type: string
        kind:
          type: string
          description: A work account, or the separate admin account (D-72).
          enum: [work, admin]
    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        name:
          type: string
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          description: |
            15 to 128 characters. Common passwords and passwords that contain
            the login name, the person name, or the system name are refused.
    RoleGrant:
      type: object
      required: [role, scope]
      properties:
        role:
          type: string
          description: Role ID, for example author or verifier.
        scope:
          type: string
          description: |
            `all` for all customers, or `own_project_group` for the customers
            of the project group where the person is Project Leader or
            Project Engineer (D-71). Only author and verifier can use
            `own_project_group`.
          enum: [all, own_project_group]
    Role:
      type: object
      required: [id, level, permissions]
      properties:
        id:
          type: string
        level:
          type: string
          enum: [view, edit, verify, admin]
        permissions:
          type: array
          items:
            type: string
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    AccountInfo:
      type: object
      required: [id, kind, login, person, roles, must_change_password, disabled, created_at]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        kind:
          type: string
          enum: [work, admin]
        login:
          type: string
        person:
          $ref: '#/components/schemas/PersonInfo'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        must_change_password:
          type: boolean
        locked_until:
          type: string
          format: date-time
          description: Set while the account is locked after failed logins.
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    PersonInfo:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Opaque stable ID.
        name:
          type: string
        employee_number:
          type: string
    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountInfo'
    NewAccount:
      type: object
      required: [kind, login]
      description: |
        Give `person_id` for a person who already has an account (for example
        an admin account for the PPAP Staff, D-72), or `person_name` for a
        new person, not both.
      properties:
        person_id:
          type: string
        person_name:
          type: string
        employee_number:
          type: string
        kind:
          type: string
          enum: [work, admin]
        login:
          type: string
        roles:
          type: array
          description: Roles of a work account. An admin account always holds only the admin role.
          items:
            $ref: '#/components/schemas/RoleGrant'
    CreatedAccount:
      type: object
      required: [account, temporary_password]
      properties:
        account:
          $ref: '#/components/schemas/AccountInfo'
        temporary_password:
          type: string
          description: Shown only once. Give it to the owner of the account.
    TemporaryPassword:
      type: object
      required: [temporary_password]
      properties:
        temporary_password:
          type: string
          description: Shown only once. Give it to the owner of the account.
    RolesUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
    AuditEntry:
      type: object
      required: [seq, occurred_at, actor, action, details, prev_hash, hash]
      properties:
        seq:
          type: integer
          format: int64
          description: Number in the chain, starting at 1, without gaps.
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          type: string
          description: Event code, for example account.created or customer.created.
        target:
          $ref: '#/components/schemas/AuditTarget'
        details:
          type: object
          additionalProperties:
            type: string
          description: Never contains passwords, tokens, or keys.
        request_id:
          type: string
        source_ip:
          type: string
        prev_hash:
          type: string
          description: Hash of the entry before this one (64 zeros for the first entry).
        hash:
          type: string
          description: SHA-256 of this entry and prev_hash, 64 lowercase hexadecimal characters.
    AuditActor:
      type: object
      required: [type]
      description: |
        `human` is a logged-in account, shown with the person who holds it
        (D-74). `system` is a command on the server computer, for example
        create-admin. `anonymous` is someone who is not logged in, for
        example a failed login.
      properties:
        type:
          type: string
          enum: [human, system, anonymous]
        account_id:
          type: string
        login:
          type: string
        person_id:
          type: string
        person_name:
          type: string
    AuditTarget:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          description: What the entry is about, for example account or customer.
        id:
          type: string
        label:
          type: string
          description: Display name, for example the login of an account or the code of a customer.
    AuditEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_before:
          type: integer
          format: int64
          description: Give this as `before` to read older entries. Missing when there are no older entries.
    AuditVerification:
      type: object
      required: [valid, entries]
      properties:
        valid:
          type: boolean
        entries:
          type: integer
          format: int64
          description: Number of entries checked.
        last_seq:
          type: integer
          format: int64
        last_hash:
          type: string
          description: |
            Hash of the last entry. Noted outside the system, it also reveals
            a removed last entry later.
        broken_seq:
          type: integer
          format: int64
          description: The first entry that does not fit the chain.
        reason:
          type: string
          enum: [sequence_gap, link_mismatch, hash_mismatch]
          description: |
            `sequence_gap`: a number is missing, so an entry was removed.
            `link_mismatch`: prev_hash differs from the hash of the entry before.
            `hash_mismatch`: the content no longer matches the hash, so it was changed.
    NewCustomer:
      type: object
      required: [code, name, project_group_id]
      properties:
        code:
          type: string
          description: |
            Two letters A to Z. Spaces around the code are removed and letters
            are made uppercase. ZZ is reserved for general documents.
          example: ab
        name:
          type: string
          description: 1 to 200 characters after spaces around it are removed.
          example: Example Customer
        project_group_id:
          type: string
          description: Each customer is allocated to one project group (D-54).
    CustomerUpdate:
      type: object
      required: [name, project_group_id]
      properties:
        name:
          type: string
        project_group_id:
          type: string
        active:
          type: boolean
          # E-34 (D-111): opsional, supaya klien yang lupa mengirimnya tidak
          # menonaktifkan customer tanpa sengaja.
          description: Leave it out to keep the current status.
    CustomerCodeChange:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: |
            Two letters A to Z. A code that another customer uses, or used
            before, is refused.
    ProjectGroup:
      type: object
      required: [id, code, name, created_at]
      properties:
        id:
          type: string
        code:
          type: string
          example: GR1
        name:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectGroupInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: 1 to 10 letters A to Z or digits, made uppercase, for example GR1.
        name:
          type: string
    ProjectGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectGroup'
    ModelGroup:
      type: object
      required: [id, customer_id, name, created_at]
      description: A named set of models of one customer that share template content (D-39, D-42).
      properties:
        id:
          type: string
        customer_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    NewModelGroup:
      type: object
      required: [customer_id, name]
      properties:
        customer_id:
          type: string
        name:
          type: string
          description: 1 to 200 characters, unique within the customer.
    ModelGroupUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ModelGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelGroup'
    Model:
      type: object
      required: [id, customer_id, name, created_at]
      properties:
        id:
          type: string
        customer_id:
          type: string
        model_group:
          $ref: '#/components/schemas/ModelGroupRef'
        name:
          type: string
        created_at:
          type: string
          format: date-time
    ModelGroupRef:
      type: object
      required: [id, name]
      description: The model group of the model. Missing when the model is in no group.
      properties:
        id:
          type: string
        name:
          type: string
    NewModel:
      type: object
      required: [customer_id, name]
      properties:
        customer_id:
          type: string
        name:
          type: string
          description: 1 to 200 characters, unique within the customer.
        model_group_id:
          type: string
          description: A model group of the same customer. Leave it out for no group.
    ModelUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        model_group_id:
          type: string
          description: Leave it out to take the model out of its group.
    ModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    PartNumber:
      type: object
      required: [id, customer_id, model, number, created_at]
      properties:
        id:
          type: string
        customer_id:
          type: string
        model:
          $ref: '#/components/schemas/ModelRef'
        number:
          type: string
        name:
          type: string
          description: Name of the part, for example the description on the PFMEA.
        created_at:
          type: string
          format: date-time
    ModelRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    NewPartNumber:
      type: object
      required: [model_id, number]
      properties:
        model_id:
          type: string
        number:
          type: string
          description: 1 to 100 characters, unique within the customer of the model.
        name:
          type: string
    PartNumberUpdate:
      type: object
      required: [number]
      properties:
        number:
          type: string
        name:
          type: string
          description: Leave it out to remove the name.
    PartNumberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartNumber'
    Process:
      type: object
      required: [id, name, aliases, created_at]
      description: |
        A manufacturing step, for example IQC (D-06, R-DOC-04). The ID never
        changes; the name is only a display value. Other data refers to the
        process by its ID.
      properties:
        id:
          type: string
        name:
          type: string
        aliases:
          type: array
          description: Other names of the same process, for example the name used in an older document, ordered alphabetically.
          items:
            type: string
        created_at:
          type: string
          format: date-time
    NewProcess:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            1 to 200 characters. Repeated spaces become one. Names and aliases
            of all processes share one namespace, ignoring case: a name used
            by any process, as a name or an alias, is taken.
        aliases:
          type: array
          maxItems: 20
          description: Leave it out for no aliases. Each alias follows the rules of the name.
          items:
            type: string
    ProcessUpdate:
      type: object
      required: [name, aliases]
      properties:
        name:
          type: string
        aliases:
          type: array
          maxItems: 20
          description: Replaces all aliases of the process. Send an empty list to remove them.
          items:
            type: string
    ProcessList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Process'
    NumberSettings:
      type: object
      required: [factory_code, pattern, sequence_format, revision_digits]
      properties:
        factory_code:
          type: string
          description: One letter A to Z, the first letter of every number prefix (E-12).
          example: S
        pattern:
          type: string
          description: |
            Number pattern for new numbers (R-NUM-02, M2.1) with the tokens
            {prefix} (factory code and document type letter), {customer}, and
            {seq} (running number), separated by punctuation.
          example: '{prefix}-{customer}-{seq}'
        sequence_format:
          type: string
          enum: [letter_block]
          description: Running number format - 001 to 999, then A001 to A999, B001, up to Z999 (D-89).
        revision_digits:
          type: integer
          description: Digits of the revision label, for example 2 for -04 (R-REV-01).
          example: 2
    NumberSettingsUpdate:
      type: object
      required: [factory_code]
      properties:
        factory_code:
          type: string
        pattern:
          type: string
          description: Leave it out to keep the current pattern.
        revision_digits:
          type: integer
          description: 1 to 3. Leave it out to keep the current value.
    NewDocumentNumber:
      type: object
      required: [customer_id, document_type_id]
      properties:
        customer_id:
          type: string
        document_type_id:
          type: string
          description: PFD, PFMEA, or CP. Other document types are not numbered by the system.
        initial_revision:
          type: integer
          description: First revision of the document that uses the number, for example 4 for a legacy document entering at -04 (M2.4). Default 0.
    NextDocumentNumber:
      type: object
      required: [number]
      properties:
        number:
          type: string
          example: SC-AB-001
    NumberRegistration:
      type: object
      required: [items, replayed]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentNumber'
        replayed:
          type: boolean
          description: True when the Idempotency-Key was used before for the same request.
    DocumentNumber:
      type: object
      required: [id, number, customer, customer_code, document_type, sequence, status, initial_revision, revision_label, origin, batch_id, registered_by, created_at]
      description: One number in the register (R-NUM-04). Numbers are never deleted or reused; only the status changes.
      properties:
        id:
          type: string
        number:
          type: string
          description: The number as registered. It is never recomputed (R-NUM-02).
          example: SC-AB-001
        customer:
          $ref: '#/components/schemas/CustomerRef'
        customer_code:
          type: string
          description: The customer code inside the number. An older code when the customer code was changed later (E-11).
        document_type:
          $ref: '#/components/schemas/DocumentTypeRef'
        sequence:
          type: integer
          description: Value of the running number, for example 1 for 001 and 1000 for A001.
        status:
          type: string
          enum: [reserved, in_use, released, obsolete, void, skipped]
        initial_revision:
          type: integer
        revision_label:
          type: string
          description: The initial revision as printed, for example -04.
        origin:
          type: string
          enum: [single, set, import]
          description: How the number entered the register. Numbers of one set share batch_id.
        batch_id:
          type: string
        registered_by:
          $ref: '#/components/schemas/Person'
        status_reason:
          type: string
          description: Reason given when the number was voided or made obsolete.
        status_changed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CustomerRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
        code:
          type: string
          description: The current customer code.
        name:
          type: string
    DocumentTypeRef:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [pfd, pfmea, cp]
        name:
          type: string
    DocumentType:
      type: object
      required: [id, name, letter, prefix]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [pfd, pfmea, cp]
          description: Set for the documents this system builds. Missing for other document types from the WI.
        name:
          type: string
        letter:
          type: string
          description: One letter A to Z, unique among document types.
        prefix:
          type: string
          description: The factory code followed by the letter, for example SH.
    DocumentTypeInput:
      type: object
      required: [name, letter]
      properties:
        name:
          type: string
          description: 1 to 200 characters, unique among document types, ignoring case.
        letter:
          type: string
    DocumentTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'
    SpecialCode:
      type: object
      required: [id, code, name, created_at]
      properties:
        id:
          type: string
        code:
          type: string
          description: Two or three letters A to Z, used in place of a customer code, for example ZZ.
        name:
          type: string
        created_at:
          type: string
          format: date-time
    NewSpecialCode:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    SpecialCodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpecialCode'
    NameUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 200 characters, unique within its list, ignoring case.
    ChangeType:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [content, layout, administrative]
        name:
          type: string
        approval_route:
          $ref: '#/components/schemas/ApprovalRouteRef'
    ChangeTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeType'
    ChangeSource:
      type: object
      required: [id, name, active, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        mechanism:
          type: string
          enum: [yokoten, template, sqam]
          description: Set when the system itself creates changes with this source. Such a source stays active.
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    ChangeSourceUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        active:
          type: boolean
          description: Leave it out to keep the current status.
    ChangeSourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeSource'
    FourMCategory:
      type: object
      required: [id, key, name]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [man, machine, material, method]
        name:
          type: string
    FourMCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FourMCategory'
    Position:
      type: object
      required: [id, key, name, per_project_group, single_holder, holders]
      description: A job title in the approval workflow (D-54). The key never changes; the name may (D-58).
      properties:
        id:
          type: string
        key:
          type: string
          enum: [ppap_engineer, ppap_staff, project_engineer, project_leader, apqp_ppap_controller, npi_manager, qa_qc_manager, advisor, factory_manager]
        name:
          type: string
        per_project_group:
          type: boolean
          description: True for the Project Leader and the Project Engineer, who are held once per project group.
        single_holder:
          type: boolean
          description: |
            True for the approver positions and the APQP/PPAP Controller, which
            have one holder only (D-115). A second holder is refused with
            409 conflict, detail position_id:taken.
        holders:
          type: array
          items:
            $ref: '#/components/schemas/PositionHolder'
    PositionHolder:
      type: object
      required: [id, person, created_at]
      properties:
        id:
          type: string
        person:
          $ref: '#/components/schemas/Person'
        project_group:
          $ref: '#/components/schemas/ProjectGroupRef'
        created_at:
          type: string
          format: date-time
    NewPositionHolder:
      type: object
      required: [person_id]
      properties:
        person_id:
          type: string
        project_group_id:
          type: string
          description: Required for positions held per project group, and not allowed for other positions.
    PositionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    ApprovalRoute:
      type: object
      required: [id, name, slots, created_at]
      description: An ordered list of signature slots (R-APR-08). One Prepared slot, one Checked slot, then one or more Approved slots (D-45, D-48, D-49).
      properties:
        id:
          type: string
        name:
          type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/RouteSlot'
        created_at:
          type: string
          format: date-time
    RouteSlot:
      type: object
      required: [stage, print_title, positions]
      properties:
        stage:
          type: string
          enum: [prepared, checked, approved]
        print_title:
          type: string
          description: Printed under the holder's name, separate from the position name (R-APR-17, D-76).
        positions:
          type: array
          description: The positions allowed to sign this slot.
          items:
            $ref: '#/components/schemas/PositionRef'
    PositionRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    ApprovalRouteInput:
      type: object
      required: [name, slots]
      properties:
        name:
          type: string
          description: 1 to 200 characters, unique among approval routes, ignoring case.
        slots:
          type: array
          maxItems: 10
          description: The slots in signing order. On update the list replaces all slots.
          items:
            $ref: '#/components/schemas/RouteSlotInput'
    RouteSlotInput:
      type: object
      required: [stage, print_title, position_ids]
      properties:
        stage:
          type: string
          enum: [prepared, checked, approved]
        print_title:
          type: string
          description: 1 to 100 characters.
        position_ids:
          type: array
          items:
            type: string
    ApprovalRouteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRoute'
    ApprovalRouteRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    RouteChoice:
      type: object
      required: [route_id]
      properties:
        route_id:
          type: string
    ChangeTypeRouteChoice:
      type: object
      properties:
        route_id:
          type: string
          description: Leave it out to use the default route of each customer.
    SystemSettings:
      type: object
      required: [sign_dates_enabled]
      properties:
        sign_dates_enabled:
          type: boolean
          description: When false, signature slots have no sign date and the field is hidden (D-52).
    SystemSettingsUpdate:
      type: object
      properties:
        sign_dates_enabled:
          type: boolean
          description: Leave it out to keep the current value.
    CustomerList:
      type: object
      required: [items]
      # Daftar dibungkus objek supaya paginasi cursor (M9.3) nanti bisa
      # ditambahkan tanpa memutus klien (R-API-15).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          # E-20 (D-99): spec lama tidak ada di repo, jadi daftar dari M0.5
          # ini menjadi baseline kode error (brief R-API-13).
          enum:
            - invalid_request
            - validation_failed
            - conflict
            - not_found
            - method_not_allowed
            - unauthenticated
            - invalid_credentials
            - password_change_required
            - forbidden
            - internal_error
        message:
          type: string
          description: Short explanation for people. Never contains technical details.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          description: Same value as the X-Request-Id header.
    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Name of the field in the request body, for example code.
        code:
          type: string
          enum: [required, invalid_format, too_short, too_long, too_common, reserved, taken, incorrect, not_allowed]
        message:
          type: string
