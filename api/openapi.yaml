        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-templates/{formatTemplateId}/hidden:
    put:
      operationId: setFormatTemplateHidden
      summary: Hide or show a format template (E-11, D-218)
      description: A hidden format template is not offered for new choices (sheets of a form set, copy source). Form sets and documents that already use it do not change.
      parameters:
        - $ref: '#/components/parameters/FormatTemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HiddenUpdate'
      responses:
        '200':
          description: The format template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatTemplate'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-templates/{formatTemplateId}/versions:
    post:
      operationId: createFormatVersion
      summary: Make the next draft version of a format template from its last published version (E-11, R-TPL-05)
      description: >-
        The new version copies the fields, rating criteria, symbols, and highlight rule of the last version, with the
        same field IDs. Refused with 409 while the template still has a draft version.
      parameters:
        - $ref: '#/components/parameters/FormatTemplateId'
      responses:
        '201':
          description: The new draft version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/ap-rules:
    put:
      operationId: setFormatApRules
      summary: Replace the Action Priority table of a draft version (E-11, D-134)
      description: >-
        Only for a version with the AP risk method. The table must give exactly one priority for each of the 1,000
        combinations of severity, occurrence, and detection.
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApRuleList'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/action-priority:
    get:
      operationId: getActionPriority
      summary: The Action Priority of one severity, occurrence, and detection, from the AP table of the version (L-2, D-134)
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
        - name: severity
          in: query
          required: true
          schema:
            type: integer
        - name: occurrence
          in: query
          required: true
          schema:
            type: integer
        - name: detection
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The action priority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPriorityResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/publish:
    post:
      operationId: publishFormatVersion
      summary: Publish a draft version of a format template (E-11, R-TPL-05)
      description: A published version cannot be changed. Changes go into a new version. Refused with 409 if it is already published.
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      responses:
        '200':
          description: The published version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}:
    get:
      operationId: getFormatVersion
      summary: One format template version with its fields, rating criteria, and symbols (L-2)
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateFormatHighlights
      summary: Change the highlight rule of a draft version, for example RPN above 100 or severity 8 (E-11, R-TPL-11)
      description: Highlights mark rows; they never block saving. 0 switches a rule off, and a field that is not sent stays as it is.
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatHighlights'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/fields:
    post:
      operationId: addFormatField
      summary: Add a header field or a column at the end of its area in a draft version (E-11, R-TPL-02)
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFormatField'
      responses:
        '201':
          description: The version with the new field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/fields/{formatFieldId}:
    put:
      operationId: updateFormatField
      summary: Change the label, required flag, hidden flag, position, or options of a field in a draft version (E-11, R-TPL-02)
      description: |
        The field ID, area, and kind never change, so row content that uses
        the ID stays valid. Fields are hidden, never deleted. A field that is
        not sent stays as it is. Options cannot be removed; options without a
        key are new and get a key from their label.
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
        - $ref: '#/components/parameters/FormatFieldId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatFieldUpdate'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/rating-criteria:
    put:
      operationId: setFormatRatingCriteria
      summary: Change the criteria text of rating values in a draft version (E-11, R-TPL-01)
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingCriteriaUpdate'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/format-template-versions/{formatVersionId}/symbols:
    put:
      operationId: saveFormatSymbols
      summary: Rename symbols and add new ones in a draft version (E-11, R-TPL-11)
      description: Symbols cannot be removed, because rows may use their keys. Symbols without a key are new.
      parameters:
        - $ref: '#/components/parameters/FormatVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatSymbolList'
      responses:
        '200':
          description: The version after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatVersion'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents:
    get:
      operationId: listDocuments
      summary: Documents of one customer (L-4, M4.1)
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The documents, by number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createDocument
      summary: Make a draft document from a Reserved document number (E-2, M4.1)
      description: >-
        The document uses the latest published version of the form set of its customer (D-133) and the default approval
        route of the customer, unless another route is given with a reason (D-47). The number becomes In use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDocument'
      responses:
        '201':
          description: The document was made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}:
    get:
      operationId: getDocument
      summary: One document with its header and rows (L-4)
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/header:
    put:
      operationId: setDocumentHeader
      summary: Replace the header content of a draft document (E-2)
      description: Content is keyed by header field ID of the format version of the document (R-DOC-01).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentHeader'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/composition:
    get:
      operationId: getDocumentComposition
      summary: The points of one process template version and their state in this document set (L-4, M4.5)
      description: >-
        Shows the points that apply to the first model of the document, the most specific variant winning. A point is
        included (a row is linked to it), excluded, or undecided (R-CMP-03). Points for a document type that the set
        does not have are left out.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: process_template_version_id
          in: query
          required: true
          schema:
            type: string
        - name: section_key
          in: query
          description: The section (D-155); required when the set has sections.
          schema:
            type: string
      responses:
        '200':
          description: The composition view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: composeDocument
      summary: Use or leave out points of a published process template version (E-2, M4.5)
      description: >-
        A point in include gets a row linked to it in the document of its type, unless it already has one (R-CMP-04).
        A point in exclude loses its row and is recorded as excluded, with an optional reason (R-CMP-03). Points not
        named stay as they are. One call fills PFD, PFMEA, and CP of the same set (R-CMP-02).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeInput'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/pfd-composition:
    get:
      operationId: getPfdComposition
      summary: The PFD steps of the document set with their process template and state in the PFMEA and the CP (L-4, C4, D-211)
      description: >-
        Each PFD step (operation number and process, in PFD order) shows the latest published process template of its
        process and, per PFMEA and CP of the set, the number of points that apply to the first model and the state of
        the step: present (the document already has rows for it), to_add, no_template (it gets one row with "--"), or
        not_draft. extra lists operation numbers of the PFMEA and CP that the PFD does not have.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The steps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PfdComposition'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: composeFromPfd
      summary: Make PFMEA and CP rows for the chosen PFD steps (E-2, C4, D-211)
      description: >-
        Rows get the operation number and process of the PFD step and are ordered as the PFD. A step without a
        template gets one row with "--" in every text column (E-136). A document that already has rows for a step is
        not changed for that step. Not allowed on the PFD itself.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeFromPfdInput'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/pfmea-cp:
    get:
      operationId: getPfmeaCpComparison
      summary: The PFMEA and the CP of the document set side by side, per process (L-4, M4.9)
      description: >-
        Opens from any document of the set. Rows are grouped by process, in the order the processes first appear
        (PFMEA first, then CP); rows without a process come last. Each process may carry a "checked by, date" mark
        for the current revisions of both documents (R-DOC-06).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PfmeaCpComparison'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: markPfmeaCpChecked
      summary: Set or clear the "checked by, date" mark of one process (V-2, D-65)
      description: >-
        A mark that is still current keeps its person and time. Marking a process that changed after its check renews
        the mark. Setting and clearing are written to the audit log.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PfmeaCpCheckInput'
      responses:
        '200':
          description: The comparison after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PfmeaCpComparison'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/differences:
    get:
      operationId: getDocumentDifferences
      summary: Compare each linked row with its process template point (L-4, M4.8)
      description: >-
        A row composed from a process template stays linked to its point. The answer lists every linked row: the same
        as the template, different (with the columns that differ), or detached with its reason (R-CMP-04). Typed and
        pasted rows are left out. Differences are computed when asked; nothing is stored.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowDifferenceList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/rows/{rowId}/detach:
    post:
      operationId: detachDocumentRow
      summary: Detach one row from its process template point, with a reason (E-2, M4.8)
      description: The row stays and keeps its origin point, but is no longer compared with the template (R-CMP-04).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowDetach'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/copy:
    post:
      operationId: copyDocumentComposition
      summary: Start a document set from the rows of another model's documents (E-2, M4.7)
      description: >-
        Copies the rows and the excluded points of the source document into this one, and the same for the other
        documents of the set (PFD from PFD, PFMEA from PFMEA, CP from CP). The target set must have no rows yet, and
        the source must be another document of the same customer, document type, and form version. The copy gets new
        row IDs and is independent of its source (R-CMP-05).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCopy'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/order:
    put:
      operationId: reorderDocumentRows
      summary: Save a new order of the rows, and number the operations when asked (E-2, M4.6)
      description: >-
        row_ids holds every row of the document exactly once, in the new order. With renumber, consecutive rows of the
        same process are one step and get one operation number, in steps of 10. A number that was typed or pasted
        (operation_manual) is kept (R-CMP-01).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentOrder'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/referenced-documents:
    get:
      operationId: listReferencedDocuments
      summary: The master list of referenced documents with their process links (L-2, D-130, D-156)
      responses:
        '200':
          description: All referenced documents by number, inactive ones included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedDocumentList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createReferencedDocument
      summary: Add a referenced document such as a WI, SOP, or QEP (E-6)
      description: The number is stored in capitals and stays fixed. A number already in the list gives 409 with code taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReferencedDocument'
      responses:
        '201':
          description: The new document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedDocument'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/referenced-documents/{refDocId}:
    put:
      operationId: updateReferencedDocument
      summary: Change the title, level, revision, revision date, or active state of a referenced document (E-6)
      description: Fields left out stay as they are, except the title, which is required (D-111). Documents are never deleted; an inactive one is no longer used as a default.
      parameters:
        - $ref: '#/components/parameters/RefDocId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferencedDocumentUpdate'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedDocument'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/referenced-documents/{refDocId}/links:
    post:
      operationId: addReferencedDocumentLink
      summary: Make a document a default of one process, for a scope (E-6)
      description: >-
        The scope works like the scope of a template point (D-129): general when left out, or a customer, model group,
        or model. For one model all links that apply are added together.
      parameters:
        - $ref: '#/components/parameters/RefDocId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReferencedDocumentLink'
      responses:
        '201':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedDocument'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/referenced-documents/{refDocId}/links/{linkId}:
    delete:
      operationId: removeReferencedDocumentLink
      summary: Remove one process link of a referenced document (E-6)
      parameters:
        - $ref: '#/components/parameters/RefDocId'
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: The document after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedDocument'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes:
    get:
      operationId: listChanges
      summary: The changes of one customer, newest first (L-4, M5.1)
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChange
      summary: Submit a change request (E-3, M5.1, R-CHG-01, UC-40)
      description: >-
        A manual change has a trigger (a change source that is not a system mechanism, D-113), a type of change, an
        optional 4M category, a reason, an optional source reference, and one or more affected documents of the same
        customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewChange'
      responses:
        '201':
          description: The new change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}:
    get:
      operationId: getChange
      summary: One change with its affected documents (L-4)
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      responses:
        '200':
          description: The change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/documents:
    post:
      operationId: addChangeDocument
      summary: Add one affected document to a submitted change (E-3)
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDocumentInput'
      responses:
        '201':
          description: The change after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/documents/{documentId}:
    delete:
      operationId: removeChangeDocument
      summary: Remove one affected document from a submitted change (E-3)
      description: The last affected document cannot be removed.
      parameters:
        - $ref: '#/components/parameters/ChangeId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The change after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/sqam-changes:
    post:
      operationId: submitSQAMChange
      summary: Submit a retroactive SQAM change for every active document of a customer (E-3, M5.10)
      description: >-
        When the change is accepted, every document gets a new draft; released revisions are never rewritten
        (R-TPL-07). Documents whose number is obsolete or void are left out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SQAMChangeInput'
      responses:
        '201':
          description: The change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/yokotens:
    get:
      operationId: listYokotens
      summary: Yokoten whose source change the account can view, newest first (L-4, M5.9)
      responses:
        '200':
          description: The yokoten with their status boards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YokotenList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createYokoten
      summary: Spread an accepted change to other models (E-3, M5.9, R-CHG-04)
      description: >-
        One target per model. Models whose documents are already in the source change are left out, and only
        customers the account may propose changes for are searched (D-118).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewYokoten'
      responses:
        '201':
          description: The yokoten with its targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Yokoten'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/yokoten-targets/search:
    post:
      operationId: searchYokotenTargets
      summary: Find the yokoten targets for a filter without saving anything (E-3, M5.9)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YokotenSearch'
      responses:
        '200':
          description: The models and documents that would become targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YokotenTargetList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/yokotens/{yokotenId}:
    get:
      operationId: getYokoten
      summary: One yokoten with its status board per model (L-4, M5.9)
      parameters:
        - $ref: '#/components/parameters/YokotenId'
      responses:
        '200':
          description: The yokoten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Yokoten'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/yokotens/{yokotenId}/targets/{targetId}/decision:
    post:
      operationId: decideYokotenTarget
      summary: Apply, adapt, or mark one target not applicable (E-3 for the target customer, M5.9)
      description: Apply and adapt make a change with mechanism yokoten for the documents of the model.
      parameters:
        - $ref: '#/components/parameters/YokotenId'
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YokotenDecision'
      responses:
        '200':
          description: The yokoten after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Yokoten'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/impacts:
    put:
      operationId: saveChangeImpacts
      summary: Save the whole impact checklist of a change (E-3, M5.7)
      description: >-
        Which related documents (PFD, PFMEA, CP, WI, inspection standard) are affected, the decision, and the
        reason (R-CHG-05). The list replaces the saved one. Possible while the change is submitted or accepted.
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeImpactsInput'
      responses:
        '200':
          description: The change with the saved checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/verification:
    post:
      operationId: verifyChange
      summary: Accept or reject a submitted change with a note (V-1, M5.3)
      description: >-
        Only the Project Engineer or the Project Leader of the customer's project group, or the APQP/PPAP
        Controller, verifies (D-51, D-54). The requester cannot verify their own change (R-CHG-02).
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeVerificationInput'
      responses:
        '200':
          description: The verified change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/attachments:
    post:
      operationId: addChangeAttachment
      summary: Attach a supporting file to a submitted change (E-3, M5.2)
      description: >-
        The file goes to private storage under its SHA-256. Allowed are PDF, pictures (PNG, JPEG), Excel, Word,
        Outlook messages, text, and CSV, up to 20 MB.
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The change after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/changes/{changeId}/attachments/{attachmentId}:
    get:
      operationId: getChangeAttachment
      summary: Download one attachment of a change (L-4)
      parameters:
        - $ref: '#/components/parameters/ChangeId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: The file, always as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeChangeAttachment
      summary: Remove one attachment from a submitted change (E-3)
      description: The record stays in the audit log; the file can no longer be downloaded.
      parameters:
        - $ref: '#/components/parameters/ChangeId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: The change after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/changes:
    get:
      operationId: listDocumentChanges
      summary: The changes that affect one document, newest first (L-4)
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/migration/numbers:
    get:
      operationId: listMigratableNumbers
      summary: Numbers of one customer that a legacy document can take (E-10, M7.1)
      description: PFD, PFMEA, and CP numbers without a document that are Reserved, In use, or Released.
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The numbers, by number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigratableNumberList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/migration/documents:
    post:
      operationId: migrateDocument
      summary: Enter a legacy document as a migration baseline (E-10, M7.1)
      description: >-
        The document starts as a draft at the current revision of the signed hard copy, for example 4 for -04
        (R-REV-01), with the effective date, the preparer, and the approvers as text. Refused while migration
        mode is off (R-MIG-06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyDocument'
      responses:
        '201':
          description: The document was made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/migration/overview:
    get:
      operationId: getMigrationOverview
      summary: Readiness and status board of the migration menu for one customer (E-10, D-215)
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The readiness checks and every legacy document of the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationOverview'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/migration/sets:
    post:
      operationId: migrateSet
      summary: Enter one set of legacy documents at once (E-10, D-215, D-216)
      description: >-
        Numbers are typed as on the hard copy, without the revision. With one_set, the empty numbers follow
        the running number of the number given. Numbers not yet in the register are registered as Released in
        one batch, so the documents are one set. All or nothing: when one document is refused, nothing is
        saved. Refused while migration mode is off (R-MIG-06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacySet'
      responses:
        '201':
          description: The documents, PFD first, then PFMEA and CP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigratedSet'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/history:
    put:
      operationId: setDocumentHistory
      summary: Replace the text revision history of a migrated document (E-10, M7.2)
      description: The entries come from the history table of the legacy Excel (R-REV-05) and print in the given order.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryEntryList'
      responses:
        '200':
          description: The document with the new history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/migration/verify:
    post:
      operationId: verifyMigration
      summary: Confirm a migration baseline against the signed hard copy (E-10, M7.5)
      description: >-
        The revision is released as Released (migrated) with a snapshot and SHA-256. The scan of the signed hard
        copy must be uploaded first, and the person who entered the document cannot verify it (R-MIG-06, R-SEC-11).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationVerification'
      responses:
        '200':
          description: The document after the verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/link-suggestions:
    get:
      operationId: listLinkSuggestions
      summary: Suggested template points for rows without a link (L-4, M7.4)
      description: >-
        Suggestions come from text similarity between a row and the points of the latest published process template
        of its process (R-MIG-05). A person confirms them; nothing is linked automatically.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The suggestions, by row order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkSuggestionList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/links:
    post:
      operationId: linkDocumentRows
      summary: Link rows to template points after a person confirmed them (E-2, M7.4)
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowLinkList'
      responses:
        '200':
          description: The document with the linked rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/excel-comparison:
    post:
      operationId: compareDocumentWithExcel
      summary: Compare a document with a legacy Excel sheet (L-4, M7.3)
      description: >-
        The Excel file is only compared, never imported or stored (R-MIG-04). Cell texts are compared as a set,
        ignoring case and spaces. Leave sheet out to compare the sheet that matches best.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                sheet:
                  type: string
      responses:
        '200':
          description: The differences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcelComparison'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/released-documents:
    get:
      operationId: listReleasedDocuments
      summary: Documents of one customer that have a revision in force (L-1, D-195)
      description: The revision and status are those of the revision in force, never a draft. Void numbers are left out.
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The released documents, by number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/released-documents/{documentId}:
    get:
      operationId: getReleasedDocument
      summary: The revision in force of one document, read from its snapshot (L-1, D-195)
      description: A document that was never released does not exist for this reader (404). Row versions are 0.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The revision in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/released-documents/{documentId}/pfmea-cp:
    get:
      operationId: getReleasedPfmeaCpComparison
      summary: The released PFMEA and CP of the document set side by side, read only (L-1, D-195)
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The comparison of the revisions in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PfmeaCpComparison'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/periodic-reviews/sets:
    get:
      operationId: listReviewSets
      summary: Document sets and their periodic review status (L-2, D-138, D-196)
      description: >-
        Without all=true only the sets that are due soon or overdue. A set is the PFD, PFMEA, and CP of one customer
        with the same running number.
      parameters:
        - name: customer_id
          in: query
          schema:
            type: string
        - name: document_id
          in: query
          schema:
            type: string
        - name: all
          in: query
          schema:
            type: boolean
        - name: eol
          in: query
          description: Also the sets whose models are all end of life (D-200).
          schema:
            type: boolean
      responses:
        '200':
          description: The sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSetList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/periodic-reviews:
    get:
      operationId: listPeriodicReviews
      summary: Recent periodic review records (L-2, D-196)
      parameters:
        - name: customer_id
          in: query
          schema:
            type: string
        - name: open_only
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: The records, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodicReviewList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: recordPeriodicReview
      summary: Record a periodic review with no change (E-3, D-196)
      description: >-
        Every checklist item is answered OK or Not applicable. The revisions in force are frozen with their SHA-256.
        The record restarts the review clock once another person confirms it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPeriodicReview'
      responses:
        '201':
          description: The record, waiting for confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodicReview'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/periodic-reviews/{reviewId}/confirm:
    post:
      operationId: confirmPeriodicReview
      summary: Confirm a periodic review record (V-1, D-196)
      description: The person who recorded it cannot confirm it (R-SEC-11).
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The confirmed record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodicReview'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/performance:
    get:
      operationId: getPerformance
      summary: The performance report of PPAP Engineers (L-5, D-197)
      description: >-
        A week runs from Friday to Thursday; months and years are calendar ones, in the factory time zone (WIB).
        date picks the period that contains it; leave it out for today.
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [week, month, year]
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: customer_id
          in: query
          schema:
            type: string
        - name: person_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/periodic-reviews/sets/export:
    get:
      operationId: exportReviewSets
      summary: The periodic review list as an Excel file (L-2, D-202)
      parameters:
        - name: customer_id
          in: query
          schema:
            type: string
        - name: all
          in: query
          schema:
            type: boolean
        - name: eol
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: The Excel file.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /api/v1/performance/export:
    get:
      operationId: exportPerformance
      summary: The performance report as an Excel file (L-5, D-202)
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [week, month, year]
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: customer_id
          in: query
          schema:
            type: string
        - name: person_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The Excel file.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /api/v1/models/{modelId}/eol:
    put:
      operationId: setModelEol
      summary: Mark a model end of life, or clear the mark (E-2, D-200)
      parameters:
        - $ref: '#/components/parameters/ModelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eol]
              properties:
                eol:
                  type: boolean
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/ready:
    post:
      operationId: markDocumentReady
      summary: Mark the open draft ready to print (E-2, D-202)
      description: Only recorded for the performance report. Marking again renews the time.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The revisions of the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRevisionList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/signature-plan:
    get:
      operationId: getSignaturePlan
      summary: The slots of the document's route with the people who may sign each one (E-5, D-203)
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The plan for "Send for signature".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignaturePlan'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/documents/{documentId}/signature-requests:
    get:
      operationId: listDocumentSignatureRequests
      summary: Signature requests of one document, newest first (L-4, D-198)
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: sendForSignature
      summary: Send the open draft for digital signature (E-5, D-198, D-203, D-204)
      description: >-
        Freezes the content with SHA-256 and the route. The release date becomes today's date (WIB). The sender
        re-enters the password; when the sender is the Prepared signer, that signature is recorded at once.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureSend'
      responses:
        '201':
          description: The new request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequest'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/signature-requests:
    get:
      operationId: listSignatureRequests
      summary: Signature requests waiting for me, sent by me, and signed ones waiting for release (D-198)
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureOverview'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/signature-requests/{requestId}:
    get:
      operationId: getSignatureRequest
      summary: One signature request with its slots (L-4)
      parameters:
        - $ref: '#/components/parameters/SignatureRequestId'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequest'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/signature-requests/{requestId}/sign:
    post:
      operationId: signSignatureRequest
      summary: Sign the slot that waits for me (S-1); the password is re-entered (D-198)
      parameters:
        - $ref: '#/components/parameters/SignatureRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordConfirmation'
      responses:
        '200':
          description: The request after signing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequest'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/signature-requests/{requestId}/reject:
    post:
      operationId: rejectSignatureRequest
      summary: Reject the request when my signature is awaited (S-1); the draft opens again
      parameters:
        - $ref: '#/components/parameters/SignatureRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRejection'
      responses:
        '200':
          description: The rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequest'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/signature-requests/{requestId}/withdraw:
    post:
      operationId: withdrawSignatureRequest
      summary: Withdraw a waiting request (the sender, E-5); the draft opens again
      parameters:
        - $ref: '#/components/parameters/SignatureRequestId'
      responses:
        '200':
          description: The withdrawn request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequest'
