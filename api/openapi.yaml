  /api/v1/document-number-imports:
    post:
      operationId: importDocumentNumbers
      summary: Import legacy numbers of one customer, with a report (E-8, UC-14, R-NUM-06)
      description: |
        Paste the legacy numbers one set per line (D-216): up to three columns
        with the PFD, PFMEA, and CP numbers copied from the Excel register,
        separated by tabs, in any order. Blank columns are skipped, and
        columns after the third are ignored. Each line becomes one batch, so
        the numbers of one line are one document set (E-140). With
        `one_set`, the numbers missing from a line follow the running number
        of its first number. Numbers keep their original text, and the counter of each
        customer code and document type rises to the highest number, so new
        numbers continue after it. Gaps, duplicates, and misaligned sets are
        reported and never fixed or renumbered. Lines that are not a PFD,
        PFMEA, or CP number in the current pattern, and numbers with another
        customer's code (R-POR-01), are reported and not imported. With
        `dry_run`, nothing is saved. Repeating an import imports nothing new:
        the numbers are reported as existing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberImportRequest'
      responses:
        '200':
          description: The import report. Nothing was saved with dry_run, or when no line was new.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberImportReport'
        default:
          $ref: '#/components/responses/Error'
